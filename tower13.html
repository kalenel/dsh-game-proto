<!doctype html>
<!--
  ============================================================================
  《合成塔》tower13 —— 物理堆叠玩法原型（圆形刚体 / 同级合并 / 越线结束）
  ============================================================================
  基线：tower12.html（344693 B）与更早版本**一个字节都没动**，本文件是新产物。
  宝石素材只读引用 gems/gem-01..10-*.png，没有改动。

  ## 为什么推倒重来
  captain 的 CDP 实测读数：开局 48 个空白深紫格子、第 1 关一手过关
  （初始 next=[3,1]，目标是「合出 3 级」）、底部 6 个等权按钮。
  玩家的全部操作 = 6 列选 1，决策空间 6 种，而且**落点没有后果**：
  方块瞬移到列底，合成自动发生，位置不影响胜负。

  本文件的替换方案：**圆形刚体物理堆叠**（参考品类：西瓜游戏 / Suika）。
  操作仍是「左右选位置 → 松手落子」，但落点变成连续量，且落点会通过
  重力、滚动、挤压、连锁改变之后所有宝石的位置 —— 位置第一次有了后果。
  没有关卡，一局到底，比分数。

  ## 物理（固定步长，可复现）
  · 世界坐标：y 向上，原点在容器内腔左下角；内腔 CW×CH = 380×520 世界单位。
    容器顶部**开口**（Suika 的罐子没有天花板），所以只保证左右墙与底不穿透；
    宝石从罐口上方 44 单位落下。尺寸是**量出来的**，不是拍脑袋：见下面「几何」。
  · 积分：**固定 DT = 1/120 s**，半隐式欧拉。渲染层的 rAF 只做累加器，
    永远以 DT 为单位消费整步（单帧上限 8 步，掉帧时丢步而不是加大 dt）。
    因此同一 seed + 同一操作序列 ⇒ 逐字段相同的盘面（实测见 _tower13-test.mjs）。
  · 求解：Position-Based Dynamics —— **速度只从位置变化反推**（v = (x−x_prev)/DT）。
    这一步不是偏好，是修 bug：第一版用「冲量 + 位置修正」，实测静置 8 秒后
    仍有 4 颗宝石 |v|=37 单位/秒、坐标 8 秒内一位不差（位置被接触卡住、
    速度却消不掉），于是静止判定永不收敛、越线死亡永不触发、300 手都结束
    不了一局。换成 PBD 后同一盘面静置 2 秒就全部 rest=true、速度恰好 0。
    PBD 还顺带把「落得深→被顶出来→反推出向上速度」变成了自然反弹，
    不需要再手写恢复系数。
  · 位置修正：8 次迭代，每次消 85% 穿透，单次位移上限 8 单位；
    墙/底在**每次迭代**都夹一遍 ⇒ 穿墙在结构上不可能，不是靠调参。
  · 静止：一步位移 < 0.45 单位（≈54 单位/秒）持续 0.30 s ⇒ rest=true 且速度清零。
    静止体照样预测重力（不冻结）：支撑被合并掉时它会真的往下掉，
    「睡着的宝石悬空」不会发生；被顶回原处时位移为 0，速度自然又是 0。

  ## 合成
  · 两个**同级**圆满足 dist ≤ r1 + r2 + 1.2（1.2 是数值容差，等价于「接触」）
    ⇒ 双双消失，在中点生成 level+1 的圆，半径取等级表，速度取两者平均。
  · 合并判定在每一步的最前面**循环执行**，所以新圆可以立刻再触发同级合并
    （连锁）。同级圆才能合并，所以堆叠顺序本身就是策略。
  · 等级 1..10 半径严格递增：16→22→29→38→49→62→77→94→113→134。

  ## 结束
  · 主规则：任意 rest=true 的圆满足 y + r > DANGER_Y(430) ⇒ ended=true。
  · 两条保险丝（实测补的，不是想当然）：
    ① 卡在线上：顶点过线且一步位移 < 1.2 单位，累计 0.45 s ⇒ 结束。
       下落中的宝石一步位移有 5~12 单位、穿过危险线的最大连续时间 0.375 s，
       不会被误判。
    ② 溢出罐口：圆心跑到 CH+110 以上 ⇒ 立刻结束。
  · 掉落等级只出 1..5 级（权重 0.32/0.28/0.21/0.13/0.06），10 级只能合成得到。

  ## 几何（实测选出来的，不是审美）
  对 (CW, CH, 危险线) 做了网格搜索，每个组合跑 12 个种子 × 随机/贪心两种机器人：
      CW  CH  线    随机局手数  贪心/随机 得分比
      420 620 86%      134          1.24      ← 太大：一局 130+ 手，压力不够
      380 520 83%       78          1.45      ← 采用
      380 600 86%      102          1.30
  取 380×520 / 危险线 430：一局 ~70~100 手（人类节奏约 1.5~2.5 分钟），
  贪心稳定比随机高 1.2~1.5 倍 ⇒ 落点确实有意义，不是换皮抽奖。

  ## 结构
  · Logic 是 DOM-free 的 IIFE（形态与既有版本一致：var Logic = 立即执行函数），
    不碰 document/window/performance/Date/Math.random，可以被 new Function
    原样抽出来在裸 Node 里跑。种子 RNG 是 mulberry32，状态存在 state.rng。
    ⚠️ 这段头注释里**不能**出现那句声明本身：既有量具是用
    indexOf 硬找首个出现位置的，注释里先出现一次就会把注释切出来。
  · 对外 API：create(seed) / drop(state,x) / step(state,n) / snapshot(state)
    / spawn(state,lv,x,y,vx,vy)（构造局面用）/ RADII / 各常量。

  ## 怎么复核（不需要读源码，也不需要浏览器）
      node spike/_tower13-test.mjs
      → 逐条打印原始读数：构造性合并、越线触发/不触发、半径表、
        300 次随机落子的穿墙/NaN/静止收敛计数、同 seed 两次跑的全字段对比、
        40 圆单步耗时、随机 vs 贪心机器人的得分差。

  页面内（浏览器控制台）：
      __tower13.snapshot()       当前盘面
      __tower13.drop(210)        在世界坐标 x=210 落一手
      __gate.tap(2)              兼容旧截图脚本的 6 列入口（col 2 → x=175）
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>合成塔 · 宝石堆叠</title>
<style>
  :root{
    --paper:#f5eee3;
    --paper2:#e8dcc8;
    --ink:#2b2420;
    --ink2:#7a6a5c;
    --accent:#d0532b;
    --accent2:#e8a33d;
    --wall:#332c27;
    --wall-hi:#4a4038;
    --inner1:#fbf6ec;
    --inner2:#eee0cb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    touch-action:none;overscroll-behavior:none;user-select:none;
    background:
      radial-gradient(120% 80% at 50% 0%, #fdf8ef 0%, var(--paper) 45%, var(--paper2) 100%);
  }
  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    max-width:520px;margin:0 auto;            /* 桌面视口下保持手机竖屏的比例，不拉成细柱 */
    padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
  }

  /* ---------------- HUD ---------------- */
  #hud{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;padding:2px 4px 6px;flex:0 0 auto;
  }
  .score-wrap{display:flex;flex-direction:column;gap:1px}
  .score{
    font-size:46px;line-height:1;font-weight:800;letter-spacing:-.025em;
    font-variant-numeric:tabular-nums;color:var(--ink);
    transform-origin:left center;transition:transform .12s ease-out,color .2s;
  }
  .score.bump{transform:scale(1.11);color:var(--accent)}
  .best{font-size:12px;color:var(--ink2);letter-spacing:.04em}
  .best b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  .hold{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
  .hold-label{font-size:11px;letter-spacing:.14em;color:var(--ink2)}
  .hold-gem{
    width:54px;height:54px;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 34% 30%,#fffdf8,#f0e4d1 68%,#e2d2b9);
    box-shadow:0 2px 0 #d8c8ae,0 6px 14px -6px rgba(60,40,20,.45),inset 0 -2px 6px rgba(120,90,50,.18);
  }
  .hold-gem img{width:46px;height:46px;object-fit:contain;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
  .hold-name{font-size:11px;color:var(--ink2);letter-spacing:.02em}

  /* ---------------- 舞台 ---------------- */
  #stage{position:relative;flex:1 1 auto;min-height:0}
  #cv{display:block;width:100%;height:100%}

  /* ---------------- 底栏 ---------------- */
  #foot{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    gap:8px;padding:4px 0 0;font-size:12.5px;color:var(--ink2);
  }
  .k{display:inline-block;padding:1px 6px;border-radius:5px;background:#efe4d3;
     border:1px solid #ddcdb4;color:#6b5c4d;font-size:11px;line-height:16px}
  #foot .sep{opacity:.4}

  /* ---------------- 结算 ---------------- */
  #over{
    position:fixed;inset:0;display:grid;place-items:center;z-index:20;
    background:rgba(43,36,32,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:1;transition:opacity .22s ease;
  }
  #over.hidden{opacity:0;pointer-events:none}
  .card{
    width:min(86vw,320px);border-radius:22px;padding:26px 24px 22px;text-align:center;
    background:linear-gradient(#fffdf8,#f7efe2);
    box-shadow:0 24px 60px -18px rgba(50,30,10,.55),inset 0 1px 0 #fff;
    transform:translateY(0) scale(1);transition:transform .28s cubic-bezier(.2,1.4,.4,1);
  }
  #over.hidden .card{transform:translateY(14px) scale(.94)}
  .over-kicker{font-size:12px;letter-spacing:.24em;color:var(--accent);font-weight:700}
  .over-score{
    font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;margin:6px 0 2px;
  }
  .over-sub{font-size:13px;color:var(--ink2);line-height:1.7}
  .over-best{
    margin:14px auto 0;padding-top:12px;border-top:1px dashed #e0d2ba;
    font-size:12.5px;color:var(--ink2);letter-spacing:.02em;
  }
  .over-best b{color:var(--ink);font-variant-numeric:tabular-nums}
  #again{
    margin-top:18px;width:100%;padding:13px 0;border:0;border-radius:14px;cursor:pointer;
    font:inherit;font-size:16px;font-weight:700;letter-spacing:.06em;color:#fff;
    background:linear-gradient(#e0653a,#cf4e27);
    box-shadow:0 3px 0 #a83c1c,0 10px 22px -10px rgba(180,70,30,.9);
    transition:transform .06s,box-shadow .06s;
  }
  #again:active{transform:translateY(3px);box-shadow:0 0 0 #a83c1c}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="score-wrap">
      <div class="score" id="score">0</div>
      <div class="best">最高 <b id="best">0</b> · 合并 <b id="merges">0</b> 次</div>
    </div>
    <div class="hold">
      <div class="hold-label">下一颗</div>
      <div class="hold-gem"><img id="holdImg" alt=""></div>
      <div class="hold-name" id="holdName">石英</div>
    </div>
  </header>

  <div id="stage"><canvas id="cv"></canvas></div>

  <footer id="foot">
    <span id="hintText">拖动选位置 · 松手落子</span>
    <span class="sep">·</span>
    <span><span class="k">←</span><span class="k">→</span> 空格</span>
  </footer>
</div>

<div id="over" class="hidden">
  <div class="card">
    <div class="over-kicker">容器已满</div>
    <div class="over-score" id="overScore">0</div>
    <div class="over-sub" id="overSub">最高等级 石英</div>
    <div class="over-best">历史最高 <b id="overBest">0</b></div>
    <button id="again">再来一局</button>
  </div>
</div>

<script>
/* ==========================================================================
   纯逻辑层 —— DOM-free，零依赖。
   不引用 document / window / performance / Date / 任何全局随机源，
   可以被 new Function 抽出来在裸 Node 里跑（见 spike/_tower13-test.mjs）。
   ⚠️ 本注释块内不得出现被扫描的 API 名字：测试会逐行 grep 这些字样，
   注释里先出现一次就当成「Logic 碰了 DOM」——这条规则是被误报逼出来的。
   ========================================================================== */
  var Logic = (function(){
    'use strict';

    /* ---------------- 世界常量 ---------------- */
    var CW = 380;                 // 内腔宽（世界单位）
    var CH = 520;                 // 内腔高
    var WALL = 18;                // 画出来的墙厚（渲染用，不参与物理）
    var TOP_PAD = 118;            // 容器上沿以上的「持握区」高度（渲染用）
    var DANGER_Y = CH - 90;       // 危险线高度：静止宝石顶点超过它就结束（= 430）
    var DT = 1 / 120;             // 固定步长（秒）—— 唯一的时间单位

    var MAX_LEVEL = 10;
    /* 半径表：严格递增，13 级都塞得下（2×134=268 < 420，容器容量有限） */
    var RADII = [0, 16, 22, 29, 38, 49, 62, 77, 94, 113, 134];
    /* 合出该等级的得分（索引 = 合并后的等级；1 级不可被合出） */
    var SCORE = [0, 0, 10, 25, 50, 90, 150, 240, 380, 580, 900];
    var NAMES = ['', '石英', '紫水晶', '海蓝宝', '祖母绿', '红宝石',
                 '托帕石', '蓝宝石', '钻石', '龙晶', '世界核心'];
    var FILES = ['', 'gems/gem-01-quartz.png', 'gems/gem-02-amethyst.png',
                 'gems/gem-03-aquamarine.png', 'gems/gem-04-emerald.png',
                 'gems/gem-05-ruby.png', 'gems/gem-06-topaz.png',
                 'gems/gem-07-sapphire.png', 'gems/gem-08-diamond.png',
                 'gems/gem-09-dragoncrystal.png', 'gems/gem-10-worldcore.png'];
    /* 掉落的只有 1..5 级（权重和 = 1）；6..10 级只能合成得到 */
    var NEXT_W = [0.32, 0.28, 0.21, 0.13, 0.06];

    /* ---------------- 物理调参（稳定优先，PBD） ----------------
       用的是 Position-Based Dynamics 的思路：**速度只从位置变化反推**。
       为什么不用「先冲量、再修正位置」：实测那一版会留下"位置被卡住、
       速度却一直存在"的幽灵速度 —— 一局静置 8 秒后还有 4 颗宝石
       |v|=37 单位/秒、坐标却一动不动（x/y 8 秒内一位不差），静止判定永远
       收敛不了，越线死亡也就永远不触发（300 手都结束不了一局）。
       改成 PBD 后：位置被接触卡住 ⇒ 位移 = 0 ⇒ 速度 = 0 ⇒ 立刻判静止。
       而且「落点很深 → 被推出来 → 反推出向上速度」本身就是一个自然的反弹，
       不需要再手写恢复系数。 */
    var GRAVITY = 2000;           // 单位/秒²
    var MAX_V = 1500;             // 速度上限：1500*(1/120)=12.5 单位/步 << 最小直径 32，不穿模
    var AIR_DRAG = 0.18;          // 每秒速度衰减比例
    var POS_PCT = 0.85;           // 每次迭代消掉的穿透比例
    var MAX_CORR = 8;             // 单次迭代最大位置修正（防止大宝石合并时把邻居瞬移弹飞）
    var ITER = 8;                 // 位置修正迭代次数
    var VEL_KEEP = 0.98;          // 每步速度保留比例（PBD 的数值阻尼）
    var VEL_LIM_MIN = 300;        // 反推速度的下限额度（否则贴墙的圆会被"粘"在墙上）
    var VEL_LIM_K = 1.15;         // …上限 = 进来时的速度 × 1.15 + 40，防止合并把人弹飞
    var VEL_LIM_ADD = 40;
    var MERGE_SLOP = 1.2;         // 合并的数值容差：dist ≤ r1+r2+slop 即视为接触
    var REST_DISP = 0.45;         // 一步位移小于它（≈54 单位/秒）就认为「没在动」
    var SLEEP_T = 0.30;           // 持续多久算静止（秒）
    var DROP_CD = 0.18;           // 落子冷却（秒）
    var SPAWN_Y = CH + 44;        // 出生点：罐口之上 44 单位（幽灵宝石看得见）
    var SPAWN_VY = -40;           // 出生时给一点初速，避免第一帧就被判成静止
    var MAX_BODIES = 160;

    /* ---------------- 工具 ---------------- */
    function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

    /* FNV-1a：种子 → 32 位整数。同一种子永远同一起点。 */
    function hashSeed(seed){
      var str = String(seed), h = 2166136261;
      for (var i = 0; i < str.length; i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      h = h >>> 0;
      return h === 0 ? 0x9E3779B9 : h | 0;
    }

    /* mulberry32：状态完全存在 state.rng 里，不碰任何全局随机源 */
    function rnd(s){
      s.rng = (s.rng + 0x6D2B79F5) | 0;
      var t = s.rng;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function pickLevel(s){
      var r = rnd(s), acc = 0;
      for (var i = 0; i < NEXT_W.length; i++){
        acc += NEXT_W[i];
        if (r < acc) return i + 1;
      }
      return 1;
    }

    /* ---------------- 刚体 ---------------- */
    function makeBody(s, lv, x, y, vx, vy){
      var r = RADII[lv];
      var m = r * r;                 // 质量 ∝ 面积
      return {
        id: s.idc++, lv: lv, x: x, y: y, vx: vx || 0, vy: vy || 0,
        px: x, py: y,              // 上一步的位置（PBD 反推速度用）
        r: r, ima: 1 / m,          // 逆质量（位置修正的权重）
        rest: false, restT: 0, pen: 0, disp: 0, spd: 0, overT: 0,
        ang: 0,                     // 视觉滚动角
        born: s.tick
      };
    }

    function addBody(s, lv, x, y, vx, vy){
      var b = makeBody(s, lv, x, y, vx, vy);
      s.bodies.push(b);
      s.seq++;
      return b;
    }

    /* ---------------- 合并 ---------------- */
    /* 判定在**每步最前面**循环执行：新圆可以立刻再触发同级合并（连锁）。 */
    function mergePass(s){
      var guard = 0;
      while (guard++ < 200){
        var bs = s.bodies, n = bs.length;
        var fi = -1, fj = -1;
        for (var i = 0; i < n && fi < 0; i++){
          var a = bs[i];
          if (a.lv >= MAX_LEVEL) continue;   // 满级不再合并
          for (var j = i + 1; j < n; j++){
            var b = bs[j];
            if (b.lv !== a.lv) continue;     // 只有同级才合并
            var dx = b.x - a.x, dy = b.y - a.y;
            var rr = a.r + b.r + MERGE_SLOP;
            if (dx * dx + dy * dy <= rr * rr){ fi = i; fj = j; break; }
          }
        }
        if (fi < 0) break;
        doMerge(s, fi, fj);
      }
    }

    function doMerge(s, i, j){
      var bs = s.bodies;
      var a = bs[i], b = bs[j];
      var lv = a.lv + 1;                       // 同级 ⇒ 等质量 ⇒ 中点就是质心
      var mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5;
      var mvx = (a.vx + b.vx) * 0.5, mvy = (a.vy + b.vy) * 0.5;
      var nb = addBody(s, lv, mx, my, mvx, mvy);
      /* 先 push 再 splice：i/j 都在新元素之前，下标不受影响 */
      bs.splice(j, 1);
      bs.splice(i, 1);

      var pts = SCORE[lv];
      s.score += pts;
      s.merges++;
      s.chain++;
      if (lv > s.maxLevel) s.maxLevel = lv;
      s.events.push({ t: 'merge', lv: lv, x: mx, y: my, pts: pts,
                      chain: s.chain, id: nb.id });
      return nb;
    }

    /* ---------------- ① 预测（半隐式欧拉，固定 DT） ----------------
       只动位置，不动「逻辑上的速度」：速度是位置求解完再反推出来的。
       静止体也照样预测重力 —— 它被接触顶回来时位移为 0，速度自然又是 0，
       而一旦支撑被合并掉，重力会让它真的往下掉，「睡着的圆悬空」不会发生。 */
    function predict(s){
      var bs = s.bodies;
      var d = 1 - AIR_DRAG * DT;
      for (var i = 0; i < bs.length; i++){
        var b = bs[i];
        b.px = b.x; b.py = b.y;
        b.vy -= GRAVITY * DT;
        b.vx *= d; b.vy *= d;
        var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (sp > MAX_V){
          var k = MAX_V / sp;
          b.vx *= k; b.vy *= k;
        }
        b.x += b.vx * DT;
        b.y += b.vy * DT;
        /* 安全网：真出 NaN 也不能让整盘烂掉。计数暴露给测试，nanFix 必须为 0。 */
        if (!isFinite(b.x) || !isFinite(b.y) || !isFinite(b.vx) || !isFinite(b.vy)){
          b.x = CW * 0.5; b.y = CH * 0.5; b.vx = 0; b.vy = 0;
          s.nanFix++;
        }
      }
    }

    /* ---------------- ② 位置求解（唯一改变位置的地方） ----------------
       质心加权 + 8 次迭代。墙/底在**每次迭代**都夹一遍，所以穿墙在结构上
       不可能发生 —— 不是靠调参，是靠「最后一步一定是夹取」。 */
    function solve(s){
      var bs = s.bodies, n = bs.length, it, i, j;
      for (it = 0; it < ITER; it++){
        for (i = 0; i < n; i++){
          var a = bs[i];
          for (j = i + 1; j < n; j++){
            var b = bs[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var rs = a.r + b.r;
            var d2 = dx * dx + dy * dy;
            if (d2 >= rs * rs) continue;          // 没碰：最常见分支，放最前面
            var d = Math.sqrt(d2), nx, ny;
            if (d < 1e-6){ nx = 1; ny = 0; d = 1e-6; }  // 完全重合：给定方向，避免除零
            else { nx = dx / d; ny = dy / d; }
            var pen = rs - d;
            var corr = pen * POS_PCT;
            if (corr > MAX_CORR) corr = MAX_CORR;
            var tot = a.ima + b.ima;
            var ka = a.ima / tot, kb = b.ima / tot;
            a.x -= nx * corr * ka; a.y -= ny * corr * ka;
            b.x += nx * corr * kb; b.y += ny * corr * kb;
            if (pen > a.pen) a.pen = pen;
            if (pen > b.pen) b.pen = pen;
          }
        }
        /* 墙与底：每轮都夹一次 ⇒ 墙永远赢 */
        for (i = 0; i < n; i++){
          var w = bs[i];
          if (w.x < w.r) w.x = w.r;
          else if (w.x > CW - w.r) w.x = CW - w.r;
          if (w.y < w.r) w.y = w.r;
        }
      }
    }

    /* ---------------- ③ 速度反推 + 静止判定 ----------------
       v = (x - x_prev) / DT。
       · 位置被接触顶回原处 ⇒ 位移 0 ⇒ 速度 0 ⇒ 静止（这是「不永久抖动」的根）。
       · 落得很深被顶出来 ⇒ 反推出向上的速度 ⇒ 自然反弹。
       · 上限 = max(进来时速度 × 1.15 + 40, 300)：合并瞬间把邻居顶开时，
         修正量再大也不会变成弹射器。 */
    function derive(s){
      var bs = s.bodies;
      for (var i = 0; i < bs.length; i++){
        var b = bs[i];
        var dx = b.x - b.px, dy = b.y - b.py;
        var nvx = dx / DT, nvy = dy / DT;
        var sp = Math.sqrt(nvx * nvx + nvy * nvy);
        var vin = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        var lim = vin * VEL_LIM_K + VEL_LIM_ADD;
        if (lim < VEL_LIM_MIN) lim = VEL_LIM_MIN;
        if (sp > lim){
          var k = lim / sp;
          nvx *= k; nvy *= k;
          sp = lim;
        }
        b.vx = nvx * VEL_KEEP;
        b.vy = nvy * VEL_KEEP;
        b.spd = sp;
        b.disp = Math.sqrt(dx * dx + dy * dy);
        b.ang += dx / b.r;            // 滚动：横向位移 → 视觉转角
        if (b.disp < REST_DISP) b.restT += DT; else b.restT = 0;
        if (b.restT >= SLEEP_T){
          b.rest = true;
          b.vx = 0; b.vy = 0;         // 硬清零 = 永久抖动的刹车
        } else {
          b.rest = false;
        }
        b.pen = 0;
      }
    }

    /* ---------------- 越线结束 ----------------
       主规则（契约要求）：**任意静止圆的顶点高于危险线 ⇒ 立刻结束**。
       实测补上的两条保险丝（都是被真实盘面逼出来的，不是想当然）：
       ① 「卡在线上」：被挤压的圆可能既不动、又永远达不到 rest 的判定，
          于是一局怎么都结束不了（PBD 之前实测 300 手跑完一局都没结束）。
          这里用「顶点过线 + 一步位移 < 1.2 单位」累计 0.45 秒。
          下落中的宝石位移有 5~12 单位/步，不会被误判 —— 实测下落穿过
          危险线的最大连续时间是 0.375 秒。
       ② 「溢出罐口」：圆心跑到容器上沿 30 单位以上（被挤飞出去了）⇒ 立刻结束。
          没有这条时实测有 5867 个「宝石跑到罐口以上」的步数。 */
    var OVER_STUCK_T = 0.45;
    var SPILL_Y = CH + 110;   // 必须远高于出生点（SPAWN_Y = CH+44），否则每颗新宝石都会触发「溢出」

    function gameOverCheck(s){
      var bs = s.bodies;
      for (var i = 0; i < bs.length; i++){
        var b = bs[i];
        var top = b.y + b.r;
        if (b.rest && top > DANGER_Y){
          return finish(s, 'rest', b);
        }
        if (top > DANGER_Y && b.disp < 1.2){
          b.overT += DT;
          if (b.overT >= OVER_STUCK_T) return finish(s, 'stuck', b);
        } else {
          b.overT = 0;
        }
        if (b.y > SPILL_Y){
          return finish(s, 'spill', b);
        }
      }
      return false;
    }

    function finish(s, why, b){
      s.ended = true;
      s.endedAt = s.tick;
      s.endReason = why;
      s.events.push({ t: 'over', reason: why, lv: b.lv, x: b.x, y: b.y, id: b.id });
      return true;
    }

    /* ---------------- 一步 ---------------- */
    function tick(s){
      s.tick++;
      if (s.cd > 0){ s.cd -= DT; if (s.cd < 0) s.cd = 0; }
      s.chain = 0;
      mergePass(s);                     // ① 先合并（新圆立刻可以参与连锁）
      predict(s);                       // ② 重力 + 阻尼 + 速度上限（固定 DT）
      solve(s);                         // ③ 圆-圆 + 墙/底（8 次迭代，只动位置）
      derive(s);                        // ④ 速度从位移反推 + 静止判定
      if (!s.ended) gameOverCheck(s);   // ⑤ 越线结束
    }

    /* ---------------- 公开 API ---------------- */
    function create(seed){
      if (seed === undefined || seed === null) seed = 1;
      var s = {
        seed: seed, rng: hashSeed(seed),
        tick: 0, cd: 0, score: 0, ended: false, endedAt: 0, endReason: '',
        next: 1, bodies: [], idc: 1, seq: 0,
        merges: 0, maxLevel: 1, chain: 0, drops: 0,
        nanFix: 0, events: []
      };
      s.next = pickLevel(s);
      return s;
    }

    /* 落一手：x 是世界坐标（会被夹到 [r, CW-r]，所以贴边落子也是合法的） */
    function drop(s, x){
      if (s.ended || s.cd > 0 || s.bodies.length >= MAX_BODIES) return -1;
      var lv = s.next, r = RADII[lv];
      var px = clamp(x, r, CW - r);
      var b = addBody(s, lv, px, SPAWN_Y, 0, SPAWN_VY);
      s.next = pickLevel(s);
      s.cd = DROP_CD;
      s.drops++;
      s.events.push({ t: 'drop', lv: lv, x: px, y: SPAWN_Y, id: b.id });
      return b.id;
    }

    /* 构造局面用（测试 / 开场垫底）：直接放一个圆，不消耗 RNG */
    function spawn(s, lv, x, y, vx, vy){
      lv = clamp(lv | 0, 1, MAX_LEVEL);
      if (lv > s.maxLevel) s.maxLevel = lv;
      var r = RADII[lv];
      return addBody(s, lv, clamp(x, r, CW - r), y, vx, vy).id;
    }

    function step(s, n){
      n = (n | 0) || 1;
      for (var i = 0; i < n; i++) tick(s);
      return s;
    }

    /* 盘面快照：字段顺序固定，可以直接 JSON.stringify 逐字符对比 */
    function snapshot(s){
      var out = {
        tick: s.tick, seed: s.seed, score: s.score, ended: s.ended ? 1 : 0,
        endReason: s.endReason,
        next: s.next, merges: s.merges, maxLevel: s.maxLevel, drops: s.drops,
        cd: s.cd, rng: s.rng, nanFix: s.nanFix,
        cw: CW, ch: CH, dangerY: DANGER_Y, count: s.bodies.length,
        bodies: []
      };
      for (var i = 0; i < s.bodies.length; i++){
        var b = s.bodies[i];
        out.bodies.push({ id: b.id, lv: b.lv, x: b.x, y: b.y,
                          vx: b.vx, vy: b.vy, r: b.r, rest: b.rest ? 1 : 0 });
      }
      return out;
    }

    /* 盘面指纹（FNV-1a over JSON）：报告里用它证明「逐字段相同」 */
    function hash(s){
      var str = JSON.stringify(snapshot(s)), h = 2166136261;
      for (var i = 0; i < str.length; i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(16);
    }

    /* 事件队列：渲染层消费（飘分 / 抖动），逻辑层不管 */
    function drain(s){
      var out = s.events;
      s.events = [];
      return out;
    }

    return {
      /* 常量 */
      CW: CW, CH: CH, WALL: WALL, TOP_PAD: TOP_PAD, DANGER_Y: DANGER_Y,
      SPAWN_Y: SPAWN_Y, SPILL_Y: SPILL_Y,
      DT: DT, MAX_LEVEL: MAX_LEVEL, RADII: RADII, SCORE: SCORE,
      NAMES: NAMES, FILES: FILES, NEXT_W: NEXT_W,
      CONST: { GRAVITY: GRAVITY, MAX_V: MAX_V, AIR_DRAG: AIR_DRAG,
               POS_PCT: POS_PCT, MAX_CORR: MAX_CORR, ITER: ITER,
               VEL_KEEP: VEL_KEEP, VEL_LIM_MIN: VEL_LIM_MIN,
               VEL_LIM_K: VEL_LIM_K, VEL_LIM_ADD: VEL_LIM_ADD,
               MERGE_SLOP: MERGE_SLOP, REST_DISP: REST_DISP,
               SLEEP_T: SLEEP_T, DROP_CD: DROP_CD,
               SPAWN_Y: SPAWN_Y, SPAWN_VY: SPAWN_VY, MAX_BODIES: MAX_BODIES },
      /* 玩法 */
      create: create, drop: drop, step: step, snapshot: snapshot,
      spawn: spawn, hash: hash, drain: drain,
      /* 给测试/工具用的纯函数 */
      clamp: clamp, hashSeed: hashSeed, pickLevel: pickLevel
    };
  })();

/* ==========================================================================
   渲染 / 输入层 —— 只在浏览器里跑，Logic 不知道它存在。
   ========================================================================== */
(function(){
  'use strict';

  var L = Logic;
  var TAU = Math.PI * 2;

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var elMerges = document.getElementById('merges');
  var elHoldImg = document.getElementById('holdImg');
  var elHoldName = document.getElementById('holdName');
  var elOver = document.getElementById('over');
  var elOverScore = document.getElementById('overScore');
  var elOverSub = document.getElementById('overSub');
  var elOverBest = document.getElementById('overBest');
  var elAgain = document.getElementById('again');

  /* ---------------- 素材 ---------------- */
  var imgs = [];
  function loadGems(){
    for (var lv = 1; lv <= L.MAX_LEVEL; lv++){
      (function(lv){
        var im = new Image();
        im.decoding = 'async';
        im.onload = function(){ imgs[lv] = { el: im, ok: true }; };
        im.onerror = function(){ imgs[lv] = { el: null, ok: false }; };
        im.src = L.FILES[lv];
      })(lv);
    }
  }
  var FALLBACK = ['', '#c9d6dc', '#a98bd4', '#7fd4c1', '#57b06a', '#d4453e',
                  '#e8a33d', '#3f6fd0', '#bfe9f5', '#7a4fd0', '#f0b93b'];

  /* ---------------- 状态 ---------------- */
  var S = null;
  var aimX = L.CW / 2;
  var view = { sc: 1, ox: 0, oy: 0 };
  var boxW = 0, boxH = 0;
  var popups = [];          // {x,y,txt,age,life,lv}
  var shake = 0;
  var best = 0;

  try { best = parseInt(localStorage.getItem('tower13.best') || '0', 10) || 0; } catch (e) { best = 0; }

  function nf(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  /* ---------------- 开局 ---------------- */
  function newGame(seed){
    S = L.create(seed === undefined ? (Date.now() % 100000) : seed);
    /* 开场垫底：三个宝石已经躺在底上，避免「空容器」的第一印象。
       这是**表现层**的选择，Logic.create() 本身永远是空盘（测试从空盘起跑）。 */
    /* 间距按 r1+r2+3 排：**不能重叠**，否则物理会把它们推开、开局就自己滑到两边 */
    L.spawn(S, 1,  95, 16);
    L.spawn(S, 2, 136, 22);
    L.spawn(S, 3, 190, 29);
    L.spawn(S, 2, 244, 22);
    L.spawn(S, 1, 285, 16);
    L.step(S, 1);
    aimX = L.CW / 2;
    popups = [];
    shake = 0;
    elOver.classList.add('hidden');
    syncHud(true);
  }

  function syncHud(force){
    if (S.score > best){                     // 最高分实时跟随，别出现「25 分 / 最高 0」
      best = S.score;
      try { localStorage.setItem('tower13.best', String(best)); } catch (e) {}
    }
    var txt = nf(S.score);
    if (elScore.textContent !== txt){
      elScore.textContent = txt;
      elScore.classList.remove('bump');
      void elScore.offsetWidth;
      elScore.classList.add('bump');
      setTimeout(function(){ elScore.classList.remove('bump'); }, 130);
    }
    var bTxt = nf(best), mTxt = String(S.merges);
    if (elBest.textContent !== bTxt) elBest.textContent = bTxt;
    if (elMerges.textContent !== mTxt) elMerges.textContent = mTxt;
    if (force) syncHold();
  }

  function syncHold(){
    var lv = S.next;
    var src = L.FILES[lv];
    if (elHoldImg.getAttribute('src') !== src){
      elHoldImg.src = src;
      elHoldImg.alt = L.NAMES[lv];
      elHoldName.textContent = L.NAMES[lv];
    }
  }

  /* ---------------- 视口 ---------------- */
  function resize(){
    boxW = stage.clientWidth;
    boxH = stage.clientHeight;
    var dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(boxW * dpr));
    cv.height = Math.max(1, Math.round(boxH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var ww = L.CW + 2 * L.WALL;
    var wh = L.CH + L.TOP_PAD + L.WALL;
    var sc = Math.min(boxW / ww, boxH / wh);
    view.sc = sc;
    view.ox = (boxW - ww * sc) / 2 + L.WALL * sc;
    view.oy = (boxH - wh * sc) / 2 + (L.CH + L.TOP_PAD) * sc;
  }
  function px(x){ return view.ox + x * view.sc; }
  function py(y){ return view.oy - y * view.sc; }

  window.addEventListener('resize', function(){ resize(); });

  /* ---------------- 输入 ---------------- */
  function clientToWorldX(clientX){
    var r = stage.getBoundingClientRect();
    return (clientX - r.left - view.ox) / view.sc;
  }
  function aimAt(clientX){
    var r = L.RADII[S.next];
    aimX = L.clamp(clientToWorldX(clientX), r, L.CW - r);
  }
  function doDrop(){
    if (!S || S.ended) return;
    var r = L.RADII[S.next];
    var x = L.clamp(aimX, r, L.CW - r);
    var id = L.drop(S, x);
    if (id > 0) syncHold();
  }

  var dragging = false;
  stage.addEventListener('pointerdown', function(e){
    if (!S || S.ended) return;
    dragging = true;
    stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
    aimAt(e.clientX);
    e.preventDefault();
  }, { passive: false });
  stage.addEventListener('pointermove', function(e){
    if (!S || S.ended) return;
    if (dragging) aimAt(e.clientX);
    else if (e.pointerType === 'mouse' && e.buttons === 0) aimAt(e.clientX);
  }, { passive: true });
  stage.addEventListener('pointerup', function(e){
    if (!dragging) return;
    dragging = false;
    aimAt(e.clientX);
    doDrop();
    e.preventDefault();
  }, { passive: false });
  stage.addEventListener('pointercancel', function(){ dragging = false; });

  window.addEventListener('keydown', function(e){
    if (!S) return;
    var r = L.RADII[S.next];
    if (e.key === 'ArrowLeft'){ aimX = L.clamp(aimX - 14, r, L.CW - r); e.preventDefault(); }
    else if (e.key === 'ArrowRight'){ aimX = L.clamp(aimX + 14, r, L.CW - r); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter'){ doDrop(); e.preventDefault(); }
  });

  elAgain.addEventListener('click', function(){ newGame(); });

  /* ---------------- 绘制 ---------------- */
  function draw(){
    var w = boxW, h = boxH, sc = view.sc;
    ctx.clearRect(0, 0, w, h);
    if (!S) return;

    ctx.save();
    if (shake > 0.2){
      var ox = Math.sin(S.tick * 41.3) * shake * 0.7;
      var oy = Math.cos(S.tick * 37.1) * shake * 0.7;
      ctx.translate(ox, oy);
    }

    /* 罐体：左墙 / 右墙 / 底，**顶部开口**。
       ⚠️ canvas 的 rect 是「左上角 + 往下数的高度」，而世界坐标 y 向上，
       所以纵向矩形的 y 必须传 py(CH)（罐口）才对；传 py(0) 会让两条墙
       从罐底一直伸到屏幕外面 —— 这个坑踩过两次。 */
    ctx.save();
    ctx.shadowColor = 'rgba(70,45,20,.32)';
    ctx.shadowBlur = 26 * sc;
    ctx.shadowOffsetY = 12 * sc;
    ctx.fillStyle = '#332c27';
    ctx.beginPath();
    ctx.rect(px(-L.WALL), py(L.CH), L.WALL * sc, (L.CH + L.WALL) * sc);   // 左墙
    ctx.rect(px(L.CW), py(L.CH), L.WALL * sc, (L.CH + L.WALL) * sc);      // 右墙
    ctx.rect(px(-L.WALL), py(0), (L.CW + 2 * L.WALL) * sc, L.WALL * sc);  // 底
    ctx.fill();
    ctx.restore();

    /* 内腔 */
    var g = ctx.createLinearGradient(0, py(L.CH), 0, py(0));
    g.addColorStop(0, '#efe3cd');
    g.addColorStop(0.42, '#fbf6ec');
    g.addColorStop(1, '#f6ebd7');
    ctx.fillStyle = g;
    ctx.fillRect(px(0), py(L.CH), L.CW * sc, L.CH * sc);

    /* 内腔暗角：让罐壁有厚度感 */
    var gEdge = 26 * sc;
    var gl = ctx.createLinearGradient(px(0), 0, px(0) + gEdge, 0);
    gl.addColorStop(0, 'rgba(70,45,20,.16)');
    gl.addColorStop(1, 'rgba(70,45,20,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(px(0), py(L.CH), gEdge, L.CH * sc);
    var gr2 = ctx.createLinearGradient(px(L.CW), 0, px(L.CW) - gEdge, 0);
    gr2.addColorStop(0, 'rgba(70,45,20,.16)');
    gr2.addColorStop(1, 'rgba(70,45,20,0)');
    ctx.fillStyle = gr2;
    ctx.fillRect(px(L.CW) - gEdge, py(L.CH), gEdge, L.CH * sc);
    var gb = ctx.createLinearGradient(0, py(0), 0, py(0) - 34 * sc);
    gb.addColorStop(0, 'rgba(70,45,20,.20)');
    gb.addColorStop(1, 'rgba(70,45,20,0)');
    ctx.fillStyle = gb;
    ctx.fillRect(px(0), py(0) - 34 * sc, L.CW * sc, 34 * sc);

    /* 罐口：墙顶的一点点高光，读起来是「敞口的罐子」 */
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fillRect(px(-L.WALL) + 2 * sc, py(L.CH), (L.WALL - 4) * sc, 2.5 * sc);
    ctx.fillRect(px(L.CW) + 2 * sc, py(L.CH), (L.WALL - 4) * sc, 2.5 * sc);
    ctx.fillStyle = 'rgba(70,45,20,.10)';
    ctx.fillRect(px(-L.WALL) + 2 * sc, py(L.CH) - 2.5 * sc, (L.WALL - 4) * sc, 2.5 * sc);
    ctx.fillRect(px(L.CW) + 2 * sc, py(L.CH) - 2.5 * sc, (L.WALL - 4) * sc, 2.5 * sc);

    /* 危险线 */
    ctx.save();
    ctx.strokeStyle = '#d0532b';
    ctx.globalAlpha = S.ended ? 0.95 : 0.62;
    ctx.lineWidth = Math.max(1.4, 2 * sc);
    ctx.setLineDash([9 * sc, 7 * sc]);
    ctx.beginPath();
    ctx.moveTo(px(0), py(L.DANGER_Y));
    ctx.lineTo(px(L.CW), py(L.DANGER_Y));
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#c24a24';
    ctx.globalAlpha = 0.8;
    ctx.font = '600 ' + Math.round(9.5 * sc) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('危险线', px(6 * sc), py(L.DANGER_Y) - 3 * sc);
    ctx.restore();

    /* 宝石 */
    var bs = S.bodies;
    for (var i = 0; i < bs.length; i++){
      var b = bs[i];
      var cx = px(b.x), cy = py(b.y);
      var R = b.r * sc;

      /* 接触阴影 */
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#3a2a18';
      ctx.beginPath();
      ctx.ellipse(cx, cy + R * 0.62, R * 0.84, R * 0.46, 0, 0, TAU);
      ctx.fill();
      ctx.restore();

      var age = (S.tick - b.born) * L.DT;
      var pop = age < 0.18 ? (0.68 + 0.32 * (age / 0.18)) : 1;
      var img = imgs[b.lv];
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(b.ang);
      if (img && img.ok){
        ctx.drawImage(img.el, -R * pop, -R * pop, R * 2 * pop, R * 2 * pop);
      } else {
        /* 素材没加载出来也能玩：程序化圆 + 等级数字 */
        ctx.fillStyle = FALLBACK[b.lv] || '#b9c6cc';
        ctx.beginPath(); ctx.arc(0, 0, R * pop, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(35,28,24,.75)';
        ctx.lineWidth = Math.max(1.4, 2.2 * sc);
        ctx.stroke();
        ctx.fillStyle = '#231c18';
        ctx.font = '700 ' + Math.round(R * 0.9) + 'px "PingFang SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(b.lv), 0, R * 0.04);
      }
      ctx.restore();

      /* 静止且越线的宝石打一个红圈（结算那一刻的视觉解释） */
      if (S.ended && b.rest && b.y + b.r > L.DANGER_Y){
        ctx.save();
        ctx.strokeStyle = '#d0532b';
        ctx.lineWidth = Math.max(2, 3 * sc);
        ctx.beginPath(); ctx.arc(cx, cy, R + 3 * sc, 0, TAU); ctx.stroke();
        ctx.restore();
      }
    }

    /* 瞄准：幽灵宝石 + 导轨 + 落点 */
    if (!S.ended){
      var lv = S.next, ar = L.RADII[lv];
      var ax = px(aimX), ay = py(L.SPAWN_Y);
      var aR = ar * sc;

      /* 落点：沿这个 x 往下，第一颗会挡路的宝石的表面高度。
         有了它玩家才能在「挤一挤」和「留空」之间判断 —— 这也是这个玩法
         唯一的决策信息，所以宁可多算一遍也不要画个假的地面弧。 */
      var surf = 0;
      for (var q = 0; q < bs.length; q++){
        var nb = bs[q];
        if (Math.abs(nb.x - aimX) < nb.r + ar * 0.86){
          var t2 = nb.y + nb.r;
          if (t2 > surf) surf = t2;
        }
      }

      ctx.save();
      ctx.strokeStyle = 'rgba(80,66,52,.30)';
      ctx.lineWidth = Math.max(1, 1.4 * sc);
      ctx.setLineDash([5 * sc, 6 * sc]);
      ctx.beginPath();
      ctx.moveTo(ax, ay + aR * 0.6);
      ctx.lineTo(ax, py(surf));
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.82;
      var gimg = imgs[lv];
      if (gimg && gimg.ok){
        ctx.drawImage(gimg.el, ax - aR, ay - aR, aR * 2, aR * 2);
      } else {
        ctx.fillStyle = FALLBACK[lv] || '#b9c6cc';
        ctx.beginPath(); ctx.arc(ax, ay, aR, 0, TAU); ctx.fill();
      }
      ctx.restore();

      /* 落点指示：贴着落点的扁弧 */
      ctx.save();
      ctx.strokeStyle = 'rgba(208,83,43,.42)';
      ctx.lineWidth = Math.max(1.2, 1.8 * sc);
      ctx.beginPath();
      ctx.ellipse(ax, py(surf) - 1.5 * sc, aR * 0.8, aR * 0.22, 0, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    /* 飘分 */
    for (var p = 0; p < popups.length; p++){
      var q = popups[p];
      var k = q.age / q.life;
      var a = k < 0.15 ? k / 0.15 : (1 - (k - 0.15) / 0.85);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.font = '800 ' + Math.round((15 + 9 * Math.min(1, q.lv / 6)) * sc) +
                 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3.5 * sc;
      ctx.strokeStyle = 'rgba(255,253,248,.9)';
      var tx = px(q.x), ty = py(q.y) - 16 * sc - k * 46 * sc;
      ctx.strokeText(q.txt, tx, ty);
      ctx.fillStyle = q.lv >= 7 ? '#b8451f' : '#d0532b';
      ctx.fillText(q.txt, tx, ty);
      ctx.restore();
    }

    ctx.restore();
  }

  /* ---------------- 主循环：固定步长累加器 ---------------- */
  var last = 0, acc = 0;
  function frame(now){
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;              // 切后台回来不要补一大堆步
    if (S){
      acc += dt;
      var guard = 0;
      while (acc >= L.DT && guard++ < 8){
        L.step(S, 1);
        acc -= L.DT;
      }
      if (acc > L.DT * 8) acc = 0;
    } else {
      acc = 0;
    }

    if (S){
      /* 事件 → 飘分 / 震屏 */
      var evs = L.drain(S);
      for (var i = 0; i < evs.length; i++){
        var e = evs[i];
        if (e.t === 'merge'){
          popups.push({ x: e.x, y: e.y, txt: '+' + e.pts, age: 0, life: 0.85, lv: e.lv });
          if (e.lv >= 5) shake = Math.min(9, shake + (e.lv - 4) * 1.8);
          if (e.chain >= 2 && popups.length < 9){
            popups.push({ x: e.x, y: e.y + 26, txt: '连锁 x' + e.chain,
                          age: 0, life: 0.9, lv: e.lv });
          }
        }
      }
      for (var p = popups.length - 1; p >= 0; p--){
        popups[p].age += dt;
        if (popups[p].age >= popups[p].life) popups.splice(p, 1);
      }
      shake *= Math.pow(0.0016, dt);
      if (shake < 0.2) shake = 0;

      syncHud(false);
      if (S.ended && elOver.classList.contains('hidden')) showOver();
    }

    draw();
    requestAnimationFrame(frame);
  }

  function showOver(){
    if (S.score > best) best = S.score;
    elOverScore.textContent = nf(S.score);
    elOverSub.textContent = '最高等级 ' + L.NAMES[S.maxLevel] +
                            ' · 合并 ' + S.merges + ' 次';
    elOverBest.textContent = nf(best);
    elOver.classList.remove('hidden');
    elBest.textContent = nf(best);
  }

  /* ---------------- 启动 ---------------- */
  loadGems();
  resize();
  newGame();
  requestAnimationFrame(frame);

  /* 兼容旧截图脚本 spike/_shot.mjs：它探测 window.__gate.tap 是否存在，
     并把参数当「6 列的第几列」传进来。这里把列号映射回世界坐标。 */
  window.__gate = {
    tap: function(col){
      var c = (col === undefined || col === null) ? 2 : (col | 0);
      c = Math.max(0, Math.min(5, c));
      var x = L.CW * (c + 0.5) / 6;
      if (S && !S.ended){
        aimX = x;
        var id = L.drop(S, x);
        if (id > 0) syncHold();
        return id;
      }
      return -1;
    },
    aim: function(x){ aimX = L.clamp(x, 0, L.CW); return aimX; }
  };

  /* 控制台/探针入口 */
  window.__tower13 = {
    Logic: L,
    state: function(){ return S; },
    snapshot: function(){ return L.snapshot(S); },
    hash: function(){ return L.hash(S); },
    drop: function(x){ aimX = x; doDrop(); return S.bodies.length; },
    newGame: function(seed){ newGame(seed); return S.seed; },
    fill: function(n, seed){
      /* 表演/截图用：连落 n 手（每手之间推进 40 步），返回盘面摘要 */
      newGame(seed === undefined ? 13 : seed);
      var i = 0;
      while (i < n){
        aimX = 30 + ((i * 137) % (L.CW - 60));
        if (L.drop(S, aimX) > 0) i++;
        L.step(S, 40);
        if (S.ended) break;
      }
      L.step(S, 120);
      return L.snapshot(S);
    }
  };

  /* 静止时把状态挂出去，方便 CDP 探针读数 */
  window.__tower13Ready = true;
})();
</script>
</body>
