<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12111E">
<title>每日同题 · 残局消除</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    background:#12111E;color:#EDEAF5;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
  body.shake #app{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translate3d(-2px,1px,0)}
    20%,80%{transform:translate3d(4px,-2px,0)}
    30%,50%,70%{transform:translate3d(-6px,2px,0)}
    40%,60%{transform:translate3d(6px,-1px,0)}
  }
  header{flex:0 0 auto;padding:2px 4px 8px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .title{font-size:15px;font-weight:800;letter-spacing:.02em}
  .sub{font-size:11px;color:#8E88A8;margin-top:3px}
  .dust{text-align:right;flex:0 0 auto}
  .dust .k{font-size:10px;letter-spacing:.08em;color:#8E88A8}
  .dust .v{font-size:17px;font-weight:800;color:#FFD479;font-variant-numeric:tabular-nums}
  .dust .s{font-size:10px;color:#6FD8C8;margin-top:1px}
  .stats{display:flex;gap:14px;margin-top:9px;align-items:flex-end}
  .stat{display:flex;flex-direction:column;gap:1px}
  .stat .k{font-size:10px;letter-spacing:.08em;color:#8E88A8;text-transform:uppercase}
  .stat .v{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;
    transition:color .2s}
  .stat .v.warn{color:#FF8A8A}
  .stat .v.bump{animation:bump .28s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28);color:#FFD479}100%{transform:scale(1)}}
  #board{flex:1 1 auto;display:grid;grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(8,1fr);gap:5px;min-height:0;padding:2px;position:relative}
  .cell{border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(12px,3.6vw,18px);color:rgba(20,19,34,.5);font-weight:900;
    transition:transform .1s ease,opacity .16s ease,box-shadow .12s ease;will-change:transform}
  .cell.empty{background:rgba(255,255,255,.03);color:transparent}
  .cell.sel{transform:scale(1.08);box-shadow:0 0 0 3px #fff inset,0 0 16px rgba(255,255,255,.5);z-index:3}
  .cell.dim{opacity:.3}
  .cell.pop{animation:pop .26s ease forwards}
  @keyframes pop{0%{transform:scale(1.08)}55%{transform:scale(1.3);filter:brightness(2.2)}
    100%{transform:scale(.15);opacity:0}}
  /* 粒子 */
  .p{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:60;
    will-change:transform,opacity}
  /* 分数飞出 */
  .fly{position:fixed;font-weight:900;pointer-events:none;z-index:70;
    font-variant-numeric:tabular-nums;will-change:transform,opacity;
    text-shadow:0 2px 10px rgba(0,0,0,.6)}
  /* 大字提示 */
  #toast{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:80;
    font-size:38px;font-weight:900;opacity:0;letter-spacing:.04em}
  #toast.show{animation:toastIn .9s cubic-bezier(.2,.9,.3,1)}
  @keyframes toastIn{
    0%{opacity:0;transform:scale(.5) translateY(14px)}
    22%{opacity:1;transform:scale(1.12) translateY(0)}
    38%{transform:scale(1)}
    100%{opacity:0;transform:scale(1.02) translateY(-22px)}
  }
  #foot{flex:0 0 auto;padding-top:8px}
  #msg{font-size:13px;line-height:1.5;min-height:20px;color:#FFD479;text-align:center}
  #msg.dim{color:#8E88A8}
  #bar{display:flex;gap:8px;margin-top:8px}
  button{flex:1;border:0;border-radius:13px;padding:14px 0;font-size:15px;font-weight:800;
    font-family:inherit;color:#141322;background:#FFD479;cursor:pointer;transition:transform .08s}
  button.ghost{background:#242238;color:#EDEAF5;box-shadow:inset 0 0 0 1px #37335A}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.35}
  #over{position:fixed;inset:0;background:rgba(18,17,30,.97);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:26px;text-align:center;z-index:90}
  #over.show{display:flex}
  #over h2{margin:0;font-size:17px;color:#8E88A8;font-weight:700}
  .stars{font-size:34px;letter-spacing:6px;line-height:1}
  .stars .on{color:#FFD479}
  .stars .off{color:#3A3654}
  #over .big{font-size:56px;font-weight:900;color:#FFD479;font-variant-numeric:tabular-nums;line-height:1}
  #over .cmp{font-size:13px;color:#8E88A8;line-height:1.7}
  #over .cmp b{color:#6FD8C8}
  #reward{background:#1C1A2C;border-radius:12px;padding:11px 14px;font-size:12.5px;color:#B9B3D0;
    line-height:1.65;max-width:330px;box-shadow:inset 0 0 0 1px #2E2A46}
  #reward b{color:#FFD479}
  #over button{max-width:240px;width:100%}
  .note{font-size:10px;color:#565073;text-align:center;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <div>
        <div class="title" id="modeTitle">每日同题 · 残局消除</div>
        <div class="sub" id="modeSub">今天所有人拿到同一副牌</div>
      </div>
      <div class="dust">
        <div class="k">星尘</div>
        <div class="v" id="dust">0</div>
        <div class="s" id="streak"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">分数</span><span class="v" id="score">0</span></div>
      <div class="stat"><span class="k">剩余步数</span><span class="v" id="moves">5</span></div>
      <div class="stat"><span class="k">最大一组</span><span class="v" id="biggest">–</span></div>
    </div>
  </header>

  <div id="board"></div>

  <div id="foot">
    <div id="msg" class="dim">点一组同色方块选中 · 再点一次消除</div>
    <div id="bar">
      <button class="ghost" id="btnMode">换练习模式</button>
      <button id="btnHint">提示</button>
    </div>
    <div class="note">原型 · 补上反馈层与积累层 · 音效由代码生成，无音频素材</div>
  </div>
</div>

<div id="toast"></div>

<div id="over">
  <h2 id="overTitle">本局结束</h2>
  <div class="stars" id="stars"></div>
  <div class="big" id="finalScore">0</div>
  <div class="cmp" id="cmp"></div>
  <div id="reward"></div>
  <button id="btnAgain">再来一局</button>
</div>

<script>
(function(){
  'use strict';

  var COLS = 7, ROWS = 8, NCOLORS = 5, MAX_MOVES = 5;
  var SKINS = [
    { name:'原色', at:0,   colors:['#FF6B6B','#FFD479','#6FD8C8','#8B7BF7','#7FD87F'] },
    { name:'霓虹', at:150, colors:['#FF4D9D','#FFE066','#4DE1FF','#B06BFF','#5CFF9D'] },
    { name:'矿物', at:400, colors:['#D96C4A','#E0B15C','#5FA8A0','#7A6BC4','#8FA85C'] }
  ];
  var GLYPHS = ['\u25CF','\u25C6','\u25B2','\u25A0','\u2605'];
  // 五声音阶：任意组合都好听，避免"难听的随机音"
  var PENTA = [1, 1.125, 1.25, 1.5, 1.6667];

  var grid = [], moves = MAX_MOVES, score = 0, sel = null, busy = false;
  var mode = 'daily', seedKey = '', chainCount = 0;
  var dust = 0, streak = 0, lastDay = '', skinIdx = 0;
  var $ = function(id){ return document.getElementById(id); };
  var boardEl = $('board');

  /* ================= 存档 ================= */
  function load(){
    try {
      var s = JSON.parse(localStorage.getItem('daily_proto_v2') || '{}');
      dust = s.dust || 0; streak = s.streak || 0; lastDay = s.lastDay || '';
      skinIdx = s.skinIdx || 0;
      if (skinIdx >= SKINS.length) skinIdx = 0;
    } catch(e){ dust = 0; streak = 0; lastDay = ''; skinIdx = 0; }
  }
  function save(){
    try { localStorage.setItem('daily_proto_v2', JSON.stringify({ dust:dust, streak:streak, lastDay:lastDay, skinIdx:skinIdx })); } catch(e){}
  }
  function skin(){ return SKINS[skinIdx]; }

  /* ================= 确定性随机 ================= */
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s){
    var h = 2166136261;
    for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function dayKey(off){
    var d = new Date(); if (off) d.setDate(d.getDate() + off);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* ================= 纯逻辑（可单测） ================= */
  function neighbors(i){
    var r = (i / COLS) | 0, c = i % COLS, out = [];
    if (r > 0) out.push(i - COLS);
    if (r < ROWS - 1) out.push(i + COLS);
    if (c > 0) out.push(i - 1);
    if (c < COLS - 1) out.push(i + 1);
    return out;
  }
  function groupAt(g, start){
    var color = g[start];
    if (color < 0) return [];
    var seen = {}, stack = [start], out = [];
    seen[start] = 1;
    while (stack.length){
      var i = stack.pop(); out.push(i);
      var nb = neighbors(i);
      for (var k = 0; k < nb.length; k++){
        var n = nb[k];
        if (!seen[n] && g[n] === color){ seen[n] = 1; stack.push(n); }
      }
    }
    return out;
  }
  function allGroups(g){
    var seen = {}, out = [];
    for (var i = 0; i < g.length; i++){
      if (g[i] < 0 || seen[i]) continue;
      var grp = groupAt(g, i);
      for (var k = 0; k < grp.length; k++) seen[grp[k]] = 1;
      if (grp.length >= 2) out.push(grp);
    }
    return out;
  }
  function removeAndGravity(g, idxs){
    for (var i = 0; i < idxs.length; i++) g[idxs[i]] = -1;
    var c, r;
    for (c = 0; c < COLS; c++){
      var col = [];
      for (r = ROWS - 1; r >= 0; r--) if (g[r*COLS+c] >= 0) col.push(g[r*COLS+c]);
      for (r = ROWS - 1; r >= 0; r--){
        var k = ROWS - 1 - r;
        g[r*COLS+c] = k < col.length ? col[k] : -1;
      }
    }
    var cols = [];
    for (c = 0; c < COLS; c++){
      var empty = true;
      for (r = 0; r < ROWS; r++) if (g[r*COLS+c] >= 0){ empty = false; break; }
      if (!empty){
        var arr = [];
        for (r = 0; r < ROWS; r++) arr.push(g[r*COLS+c]);
        cols.push(arr);
      }
    }
    while (cols.length < COLS) cols.push(new Array(ROWS).fill(-1));
    for (c = 0; c < COLS; c++) for (r = 0; r < ROWS; r++) g[r*COLS+c] = cols[c][r];
  }
  function scoreFor(n){ return n * n; }

  function makeGrid(seed){
    var rng = mulberry32(seed), attempt, g, groups, maxLen;
    for (attempt = 0; attempt < 400; attempt++){
      g = new Array(ROWS * COLS);
      for (var i = 0; i < g.length; i++) g[i] = (rng() * NCOLORS) | 0;
      groups = allGroups(g);
      maxLen = 0;
      for (var k = 0; k < groups.length; k++) if (groups[k].length > maxLen) maxLen = groups[k].length;
      if (maxLen >= 5 && groups.length >= 9) return g;
    }
    return g;
  }

  /* 参考最优（束搜索，启发式非精确） */
  function bestPossible(startGrid, movesLeft, beamWidth){
    var states = [{ g: startGrid.slice(), s: 0 }], m;
    for (m = 0; m < movesLeft; m++){
      var next = [];
      for (var i = 0; i < states.length; i++){
        var st = states[i];
        var gs = allGroups(st.g);
        for (var j = 0; j < gs.length; j++){
          var g2 = st.g.slice();
          var n = gs[j].length;
          removeAndGravity(g2, gs[j]);
          next.push({ g: g2, s: st.s + scoreFor(n) });
        }
      }
      if (!next.length) break;
      next.sort(function(a, b){ return b.s - a.s; });
      states = next.slice(0, beamWidth);
    }
    var best = 0;
    for (var q = 0; q < states.length; q++) if (states[q].s > best) best = states[q].s;
    return best;
  }

  /* ================= 音效（WebAudio，零素材） ================= */
  var ac = null;
  function audio(){
    if (ac) return ac;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; }
    return ac;
  }
  function playPop(n, isChain){
    var a = audio(); if (!a) return;
    if (a.state === 'suspended') a.resume();
    var idx = Math.min(Math.max(n - 2, 0), PENTA.length - 1);
    var oct = n >= 7 ? 2 : (n >= 5 ? 1.5 : 1);
    var base = 300 * PENTA[idx] * oct;
    var t0 = a.currentTime;
    // 主音 + 五度泛音，听起来更"亮"
    [1, 1.5].forEach(function(mult, k){
      var o = a.createOscillator(), g = a.createGain();
      o.type = k === 0 ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(base * mult, t0);
      o.frequency.exponentialRampToValueAtTime(base * mult * 1.6, t0 + 0.13);
      var vol = (k === 0 ? 0.16 : 0.07) * (isChain ? 1.25 : 1);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + 0.3);
    });
  }
  function playStar(){
    var a = audio(); if (!a) return;
    if (a.state === 'suspended') a.resume();
    var t0 = a.currentTime;
    [0, 2, 4, 7].forEach(function(semi, i){
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sine';
      o.frequency.value = 523.25 * Math.pow(2, semi / 12);
      var st = t0 + i * 0.075;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(0.13, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.42);
      o.connect(g); g.connect(a.destination);
      o.start(st); o.stop(st + 0.45);
    });
  }
  function buzz(ms){
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} }
  }

  /* ================= 视觉反馈 ================= */
  function cellCenter(i){
    var el = boardEl.children[i];
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width };
  }
  function burst(i, color, count){
    var c = cellCenter(i); if (!c) return;
    for (var k = 0; k < count; k++){
      var p = document.createElement('div');
      p.className = 'p';
      p.style.background = color;
      p.style.left = (c.x - 4) + 'px';
      p.style.top = (c.y - 4) + 'px';
      var sz = 5 + Math.random() * 7;
      p.style.width = p.style.height = sz + 'px';
      document.body.appendChild(p);
      var ang = Math.random() * Math.PI * 2;
      var dist = 26 + Math.random() * 58;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 18;
      (function(el, dx, dy){
        requestAnimationFrame(function(){
          el.style.transition = 'transform .62s cubic-bezier(.2,.7,.4,1), opacity .62s ease';
          el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.35)';
          el.style.opacity = '0';
        });
        setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 700);
      })(p, dx, dy);
    }
  }
  function flyScore(i, pts, n){
    var c = cellCenter(i); if (!c) return;
    var d = document.createElement('div');
    d.className = 'fly';
    d.textContent = '+' + pts;
    var size = Math.min(22 + n * 3.2, 52);
    d.style.fontSize = size + 'px';
    d.style.color = n >= 6 ? '#FFD479' : '#EDEAF5';
    d.style.left = (c.x - 30) + 'px';
    d.style.top = (c.y - 14) + 'px';
    document.body.appendChild(d);
    requestAnimationFrame(function(){
      d.style.transition = 'transform .95s cubic-bezier(.15,.8,.3,1), opacity .95s ease';
      d.style.transform = 'translateY(-70px) scale(1.15)';
      d.style.opacity = '0';
    });
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 1000);
  }
  function toast(text, color){
    var t = $('toast');
    t.textContent = text;
    t.style.color = color || '#FFD479';
    t.classList.remove('show');
    void t.offsetWidth;
    t.classList.add('show');
  }
  function shake(){
    document.body.classList.remove('shake');
    void document.body.offsetWidth;
    document.body.classList.add('shake');
    setTimeout(function(){ document.body.classList.remove('shake'); }, 360);
  }

  /* ================= 渲染 ================= */
  function render(popIdxs){
    var popSet = {};
    if (popIdxs) for (var k = 0; k < popIdxs.length; k++) popSet[popIdxs[k]] = 1;
    var selSet = {};
    if (sel) for (var j = 0; j < sel.length; j++) selSet[sel[j]] = 1;
    var pal = skin().colors;

    var frag = document.createDocumentFragment();
    for (var i = 0; i < grid.length; i++){
      var d = document.createElement('div');
      var v = grid[i];
      d.className = 'cell' + (v < 0 ? ' empty' : '');
      if (v >= 0){
        d.style.background = pal[v % pal.length];
        d.textContent = GLYPHS[v];
      }
      if (selSet[i]) d.className += ' sel';
      else if (sel && v >= 0) d.className += ' dim';
      if (popSet[i]) d.className += ' pop';
      d.dataset.i = i;
      frag.appendChild(d);
    }
    boardEl.innerHTML = '';
    boardEl.appendChild(frag);

    var sc = $('score');
    if (sc.textContent !== String(score)){
      sc.textContent = score;
      sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump');
    }
    var mv = $('moves');
    mv.textContent = moves;
    mv.className = 'v' + (moves <= 1 ? ' warn' : '');

    var gs = allGroups(grid), mx = 0;
    for (var q = 0; q < gs.length; q++) if (gs[q].length > mx) mx = gs[q].length;
    $('biggest').textContent = mx >= 2 ? mx : '\u2013';

    $('dust').textContent = dust;
    $('streak').textContent = streak >= 2 ? ('连续 ' + streak + ' 天') : '';
  }
  function say(t, dim){
    var m = $('msg');
    m.textContent = t;
    m.className = dim ? 'dim' : '';
  }

  /* ================= 交互 ================= */
  function tap(i){
    if (busy || moves <= 0) return;
    if (grid[i] < 0) return;
    var grp = groupAt(grid, i);
    if (grp.length < 2){
      say('单独一块消不掉 · 至少两个同色相连');
      sel = null; render(); buzz(12);
      return;
    }
    if (sel && sel.length === grp.length && sel.indexOf(i) !== -1){
      commit(grp);
    } else {
      sel = grp;
      say('这组 ' + grp.length + ' 块 · 可得 ' + scoreFor(grp.length) + ' 分 · 再点一次消除');
      render();
      buzz(8);
    }
  }

  function commit(grp){
    busy = true;
    sel = null;
    var n = grp.length, pts = scoreFor(n);
    score += pts;
    moves--;

    var pal = skin().colors;
    var color = pal[grid[grp[0]] % pal.length];

    // ① 毫秒级：粒子 + 飞出数字 + 音效 + 震动
    var perCell = n >= 7 ? 9 : (n >= 5 ? 7 : 5);
    for (var i = 0; i < grp.length; i++) burst(grp[i], color, perCell);
    flyScore(grp[Math.floor(grp.length / 2)], pts, n);
    playPop(n, chainCount > 0);
    buzz(n >= 6 ? [18, 40, 26] : 18);

    // ② 秒级：大块才有排场 —— n² 计分天然就是反馈放大器
    if (n >= 7){ shake(); toast('太漂亮了！', '#FFD479'); }
    else if (n >= 5){ shake(); toast('漂亮', '#6FD8C8'); }
    else if (n >= 4){ toast('不错', '#8B7BF7'); }

    say('消除 ' + n + ' 块  +' + pts);
    removeAndGravity(grid, grp);
    render(grp);

    setTimeout(function(){
      busy = false;
      // 连锁：掉落之后又能消
      var chain = allGroups(grid);
      if (chain.length){
        chainCount++;
        var g2 = chain[0];
        for (var k = 1; k < chain.length; k++) if (chain[k].length > g2.length) g2 = chain[k];
        var n2 = g2.length, p2 = scoreFor(n2);
        score += p2; moves--;
        for (var q = 0; q < g2.length; q++) burst(g2[q], color, 6);
        flyScore(g2[Math.floor(g2.length / 2)], p2, n2);
        playPop(n2, true);
        toast('连锁！', '#FF9BD0');
        shake();
        removeAndGravity(grid, g2);
        render(g2);
        say('连锁消除 ' + n2 + ' 块  +' + p2);
        setTimeout(function(){ busy = false; render(); check(); }, 260);
        return;
      }
      render();
      check();
    }, 220);
  }

  function check(){
    if (moves <= 0) return finish('步数用完');
    if (!allGroups(grid).length) return finish('没有可消的了');
  }

  /* ================= 结算与积累 ================= */
  function finish(reason){
    var ref = bestPossible(grid, moves, 40) + score;
    var ratio = ref > 0 ? score / ref : 0;
    var stars = ratio >= 0.9 ? 3 : (ratio >= 0.7 ? 2 : 1);

    $('overTitle').textContent = '本局结束 · ' + reason;
    var sHtml = '';
    for (var i = 1; i <= 3; i++) sHtml += '<span class="' + (i <= stars ? 'on' : 'off') + '">\u2605</span>';
    $('stars').innerHTML = sHtml;
    $('finalScore').textContent = score;
    var diff = ref - score;
    $('cmp').innerHTML = '参考最优 <b>' + ref + '</b> 分' +
      (diff <= 0 ? ' · 你已达到参考值 🎉' : ' · 差 <b>' + diff + '</b> 分');

    // ④ 回访理由：星尘 + 连续打卡 + 皮肤解锁（单人可积累，不依赖好友）
    var today = dayKey(0);
    var gained = Math.max(3, Math.round(score / 8));
    var bonusTxt = '';
    var isNewDay = (lastDay !== today);
    if (isNewDay){
      if (lastDay === dayKey(-1)) { streak++; bonusTxt = '<br>连续第 <b>' + streak + '</b> 天，星尘 +' + (streak * 2); gained += streak * 2; }
      else { streak = 1; bonusTxt = '<br>新的一天，开始连击'; }
      lastDay = today;
    }
    dust += gained;
    var unlocked = '';
    for (var s = 0; s < SKINS.length; s++){
      if (dust >= SKINS[s].at && s > skinIdx){ skinIdx = s; unlocked = '<br>解锁新色板：<b>' + SKINS[s].name + '</b>'; }
    }
    save();

    $('reward').innerHTML = '星尘 <b>+' + gained + '</b>' + bonusTxt + unlocked +
      '<br><span style="color:#6FD8C8">共 ' + dust + ' 星尘 · 当前色板 ' + skin().name + '</span>';
    $('over').classList.add('show');
    if (stars === 3) playStar();
    buzz(stars === 3 ? [20,50,20,50,40] : 30);
    render();
  }

  function hint(){
    if (busy || moves <= 0) return;
    var gs = allGroups(grid);
    if (!gs.length){ say('没有可消的了'); return; }
    var best = gs[0];
    for (var i = 1; i < gs.length; i++) if (gs[i].length > best.length) best = gs[i];
    sel = best;
    say('最大的一组是 ' + best.length + ' 块（正式版这里是激励视频位）');
    render();
  }

  function newGame(keepMode){
    if (!keepMode) mode = (mode === 'daily') ? 'practice' : 'daily';
    if (mode === 'daily'){
      seedKey = dayKey(0);
      grid = makeGrid(hashStr('daily-' + seedKey));
      $('modeTitle').textContent = '每日同题 · 残局消除';
      $('modeSub').textContent = seedKey + ' · 今天所有人拿到同一副牌';
      $('btnMode').textContent = '换练习模式';
    } else {
      seedKey = 'practice-' + Date.now();
      grid = makeGrid(hashStr(seedKey));
      $('modeTitle').textContent = '练习模式 · 残局消除';
      $('modeSub').textContent = '随机牌面 · 练手感';
      $('btnMode').textContent = '回每日同题';
    }
    moves = MAX_MOVES; score = 0; sel = null; busy = false; chainCount = 0;
    $('over').classList.remove('show');
    say('点一组同色方块选中 · 再点一次消除', true);
    render();
  }

  boardEl.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.cell') : null;
    if (!t || t.dataset.i === undefined) return;
    audio(); // 首次手势解锁音频
    tap(parseInt(t.dataset.i, 10));
  });
  $('btnHint').addEventListener('click', hint);
  $('btnMode').addEventListener('click', function(){ newGame(false); });
  $('btnAgain').addEventListener('click', function(){ newGame(true); });

  load();
  newGame(true);
  mode = 'daily';
  newGame(true);
})();
</script>
</body>
</html>
