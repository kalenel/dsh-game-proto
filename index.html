<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12111E">
<title>合成塔</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#12111E;color:#EDEAF5;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 5px) 8px calc(env(safe-area-inset-bottom) + 5px)}
  body.shake #app{animation:shake .3s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translate3d(-2px,1px,0)}20%,80%{transform:translate3d(4px,-2px,0)}
    30%,50%,70%{transform:translate3d(-6px,2px,0)}40%,60%{transform:translate3d(6px,-1px,0)}}
  /* 反馈分级：震动幅度分 4 档。
     用**不同的 keyframes 名 + 不同时长**，而不是同一套 keyframes 改 scale：
     getComputedStyle(#app).animationName / animationDuration 与真实位移都能据此读到，
     「分级生效」才是可测量的（同一套 keyframes 只改 duration 时，幅度差别不可验证）。 */
  body.shake.s1 #app{animation-name:shake1;animation-duration:.22s}
  body.shake.s2 #app{animation-name:shake2;animation-duration:.28s}
  body.shake.s3 #app{animation-name:shake3;animation-duration:.34s}
  body.shake.s4 #app{animation-name:shake4;animation-duration:.44s}
  @keyframes shake1{20%,80%{transform:translate3d(-3px,1px,0)}40%,60%{transform:translate3d(3px,-1px,0)}}
  @keyframes shake2{20%,80%{transform:translate3d(-6px,2px,0)}40%,60%{transform:translate3d(6px,-2px,0)}}
  @keyframes shake3{10%,90%{transform:translate3d(-8px,3px,0)}
    30%,50%,70%{transform:translate3d(-14px,5px,0)}40%,60%{transform:translate3d(14px,-4px,0)}}
  @keyframes shake4{10%,90%{transform:translate3d(-13px,5px,0)}
    30%,50%,70%{transform:translate3d(-24px,9px,0)}40%,60%{transform:translate3d(24px,-8px,0)}}
  header{flex:0 0 auto;padding:1px 4px 4px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .lv{font-size:12px;font-weight:900;color:#FFD479}
  .goal{font-size:14px;font-weight:800;margin-top:1px;line-height:1.25}
  .goal .now{color:#6FD8C8}
  .next{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .next .k{font-size:9.5px;color:#8E88A8}
  .nbox{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;color:rgba(18,17,30,.62);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
  .nbox.sm{width:25px;height:25px;font-size:12px;border-radius:7px;opacity:.75}
  .nbox.bomb{background:#2A2740;color:#FF8A8A;box-shadow:inset 0 0 0 2px #FF6B6B}
  .nbox.rainbow{background:linear-gradient(135deg,#FF6B6B,#FFD479,#7FD87F,#6FD8C8,#8B7BF7);color:#fff}
  .stats{display:flex;gap:12px;margin-top:5px;align-items:flex-end}
  .stat{display:flex;flex-direction:column;gap:0}
  .stat .k{font-size:9px;letter-spacing:.06em;color:#8E88A8;text-transform:uppercase}
  .stat .v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat .v.bump{animation:bump .3s ease}
  .stat .v.warn{color:#FF8A8A}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3);color:#FFD479}100%{transform:scale(1)}}
  #comboWrap{flex:0 0 auto;height:21px;margin-top:4px;position:relative;border-radius:7px;
    background:#1B1930;overflow:hidden;box-shadow:inset 0 0 0 1px #262340}
  #comboBar{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg,#8B7BF7,#FF9BD0,#FFD479);transition:width .22s ease}
  #comboTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  #comboWrap.hot #comboBar{box-shadow:0 0 14px rgba(255,212,121,.8)}
  #wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
  #colHead{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 5px 4px;max-width:430px;
    width:100%;margin:0 auto;touch-action:none}
  .ch{height:19px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900}
  .ch.bonus{background:linear-gradient(180deg,#FFD479,#E0A83C);color:#3A2A00}
  .ch.recycle{background:linear-gradient(180deg,#6FD8C8,#3FA89A);color:#00332C}
  .ch.plain{background:transparent}
  /* #wrap 是 flex 列容器，装着 #colHead + #board 两个子项。
     #board 必须显式 flex 增长，否则它只按内容高度撑开：8 行 1fr 在容器无确定高度、
     且格子为空时全部解析为 0，整盘只剩 gap+padding = 38px（实测 430x38）。
     flex 由视口推导，不写死像素高度。 */
  #board{flex:1 1 auto;min-height:0;width:100%;max-width:430px;display:grid;grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(8,1fr);gap:4px;padding:5px;border-radius:14px;background:#191728;
    box-shadow:inset 0 0 0 1px #262340;position:relative;overflow:hidden;margin:0 auto;
    /* 落子预览必须能"跟着手指走" —— 而 body 上的 touch-action:manipulation 管不到这里：
       touch-action **不继承**，实测 #board 的 computed 值是 auto，于是浏览器把横向拖拽
       当成滚动手势接管，立刻派发 pointercancel(0,0) → onUp/pointercancel 里的 showHint(-1)
       把预览抹掉。真实事件序列（修复前）：
         pointerdown@42,167 → pointermove@287,167 → pointercancel@0,0 → pointerleave@0,0
       后果是"按住能看到落点、一拖就消失"，正是本轮要修的"看不见落点"。
       这里显式声明 none：棋盘区域不需要浏览器的手势接管，拖拽全程由 pointer 事件自己处理。
       （touch-action:none 只关掉浏览器手势，不阻止 pointerdown/up —— 点击落子不受影响，
         既有 [4] 点击生效断言仍绿。） */
    touch-action:none}
  .cell{border-radius:9px;background:rgba(255,255,255,.035);position:relative}
  .cell.bcol{background:rgba(255,212,121,.10);box-shadow:inset 0 0 0 1.5px rgba(255,212,121,.35)}
  .cell.rcol{background:rgba(111,216,200,.10);box-shadow:inset 0 0 0 1.5px rgba(111,216,200,.32)}
  body.armed .cell{cursor:crosshair}
  body.armed .cell{box-shadow:inset 0 0 0 1px rgba(255,107,107,.5)}
  .blk{position:absolute;inset:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-weight:900;color:rgba(18,17,30,.6);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.22);will-change:transform}
  .blk.bomb{background:radial-gradient(circle at 35% 30%,#4A4060,#221E36);color:#FF8A8A;
    box-shadow:inset 0 0 0 2px #FF6B6B,inset 0 -3px 0 rgba(0,0,0,.3)}
  .blk.stone{background:linear-gradient(160deg,#6A6480,#413C55);color:#D8D2E8;font-size:18px;
    box-shadow:inset 0 0 0 2px #847CA0,inset 0 -3px 0 rgba(0,0,0,.35)}
  .blk.rainbow{background:linear-gradient(135deg,#FF6B6B,#FFD479,#7FD87F,#6FD8C8,#8B7BF7);
    color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
  .blk.drop{animation:fallIn .16s ease-in}
  @keyframes fallIn{from{transform:translateY(var(--fd,0px))}to{transform:translateY(0)}}
  .blk.pop{animation:popM .24s ease forwards}
  @keyframes popM{0%{transform:scale(1)}50%{transform:scale(1.34);filter:brightness(2)}100%{transform:scale(.1);opacity:0}}
  .blk.boom{animation:boomM .3s ease forwards}
  @keyframes boomM{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.5);filter:brightness(3)}100%{transform:scale(.2);opacity:0}}
  .blk.smash{animation:smashM .3s ease forwards}
  @keyframes smashM{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(.1) rotate(-16deg);opacity:0}}
  .blk.born{animation:born .3s cubic-bezier(.2,1.6,.4,1)}
  @keyframes born{0%{transform:scale(.3)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
  #blast{position:absolute;border-radius:50%;pointer-events:none;z-index:6;
    background:radial-gradient(circle,rgba(255,140,120,.85),rgba(255,90,90,0) 70%);opacity:0;transition:opacity .1s}
  #danger{position:absolute;left:5px;right:5px;height:2px;
    background:linear-gradient(90deg,transparent,#FF6B6B,transparent);opacity:0;transition:opacity .3s;
    pointer-events:none;z-index:5}
  #danger.on{opacity:.85}
  /* 危险心跳：红晕呼吸（#vignette）+ 线脉冲（#danger.pulse）+ 线上段变厚。
     强度全部由 JS 按最高列高度写成内联 style / data-level，
     所以「越高越强」是可测的（data-level 与 animation-duration 两路证据）。 */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;
    --deep:.30;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,60,60,0) 38%, rgba(255,54,54,var(--deep)) 78%, rgba(255,30,30,.62) 100%)}
  #vignette.beat{animation:vig .9s ease-in-out infinite}
  @keyframes vig{0%,100%{opacity:0}18%{opacity:1}36%{opacity:.42}54%{opacity:.92}}
  #danger.beat{animation:dpulse 1s ease-in-out infinite}
  @keyframes dpulse{0%,100%{opacity:.45;transform:scaleY(1)}20%{opacity:1;transform:scaleY(2.4)}60%{opacity:.6;transform:scaleY(1.3)}}
  /* 全屏闪光（绝境逢生专属）：比任何普通合成的表现都高一档 */
  #clutchFx{position:fixed;inset:0;pointer-events:none;z-index:85;opacity:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.96), rgba(255,212,121,.55) 42%, rgba(255,120,120,0) 76%)}
  #clutchFx.show{animation:clutchFlash .78s cubic-bezier(.1,.8,.3,1)}
  @keyframes clutchFlash{0%{opacity:0}8%{opacity:1}55%{opacity:.55}100%{opacity:0}}
  #clutchTxt{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:86;
    font-size:40px;font-weight:900;opacity:0;letter-spacing:.04em;color:#FFD479;
    text-shadow:0 2px 14px rgba(0,0,0,.75),0 0 26px rgba(255,212,121,.9)}
  #clutchTxt.show{animation:clutchIn 1.15s cubic-bezier(.2,.9,.3,1)}
  @keyframes clutchIn{0%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1.22)}
    30%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.06) translateY(-18px)}}
  /* 落子预览的样式见上方 #colHint（对齐到落点格）。 */
  /* 落子预览：不再是"整列高亮"，而是**对齐到该列的落点格**。
     几何由 showHint() 写成内联 left/top/width/height（指向具体第几格），
     所以必须去掉 bottom:5px —— 否则 height 会被拉伸成整列，又变回"看不见落点"。 */
  #colHint{position:absolute;border-radius:10px;background:rgba(255,255,255,.14);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 18px rgba(255,255,255,.22);
    opacity:0;transition:opacity .12s;pointer-events:none;z-index:4;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:900;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.8)}
  .p{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:60;will-change:transform,opacity}
  .fly{position:fixed;font-weight:900;pointer-events:none;z-index:70;font-variant-numeric:tabular-nums;
    will-change:transform,opacity;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #toast{position:fixed;left:0;right:0;top:27%;text-align:center;pointer-events:none;z-index:80;
    font-size:32px;font-weight:900;opacity:0;letter-spacing:.03em}
  #toast.show{animation:toastIn .95s cubic-bezier(.2,.9,.3,1)}
  @keyframes toastIn{0%{opacity:0;transform:scale(.5) translateY(14px)}22%{opacity:1;transform:scale(1.12)}
    38%{transform:scale(1)}100%{opacity:0;transform:scale(1.02) translateY(-22px)}}
  #foot{flex:0 0 auto;padding-top:5px}
  #tools{display:flex;gap:7px;margin-bottom:6px}
  .tool{flex:1;background:#221F36;border-radius:12px;padding:9px 0;text-align:center;
    box-shadow:inset 0 0 0 1px #37335A;cursor:pointer;transition:transform .08s,background .15s}
  .tool:active{transform:scale(.96)}
  .tool.on{background:#4A2A38;box-shadow:inset 0 0 0 2px #FF6B6B}
  .tool.dead{opacity:.32}
  .tool .ico{font-size:19px;line-height:1.1}
  .tool .lbl{font-size:10px;color:#A9A3C0;margin-top:1px}
  .tool .n{font-size:12px;font-weight:900;color:#FFD479}
  /* 石块计数器：明确不是按钮 —— 无指针、无按下缩放、无 .tool 的描边强调，
     而是弱化的信息块（用户反馈"看不懂石头的作用"，一半原因在它伪装成按钮） */
  .counter{flex:1;background:#1A1828;border-radius:12px;padding:9px 0;text-align:center;
    box-shadow:inset 0 0 0 1px #2B2740;opacity:.92;cursor:default}
  .counter .ico{font-size:19px;line-height:1.1;filter:grayscale(.25)}
  .counter .lbl{font-size:10px;color:#8E88A8;margin-top:1px}
  .counter .n{font-size:12px;font-weight:900;color:#C9C2E0}
  .counter .hint{font-size:9px;color:#6B6588;margin-top:1px}
  #msg{font-size:12.5px;line-height:1.45;min-height:18px;color:#FFD479;text-align:center}
  #msg.dim{color:#8E88A8}
  #bar{display:flex;gap:8px;margin-top:5px}
  button{flex:1;border:0;border-radius:12px;padding:11px 0;font-size:14px;font-weight:800;
    font-family:inherit;color:#141322;background:#FFD479;cursor:pointer;transition:transform .08s}
  button.ghost{background:#242238;color:#EDEAF5;box-shadow:inset 0 0 0 1px #37335A}
  button:active{transform:scale(.97)}
  .note{font-size:9.5px;color:#565073;text-align:center;margin-top:4px;line-height:1.4}
  #over{position:fixed;inset:0;background:rgba(18,17,30,.97);display:none;z-index:90;
    flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:24px;text-align:center}
  #over.show{display:flex}
  #over h2{margin:0;font-size:21px;font-weight:900}
  #over h2.win{color:#FFD479}
  #over h2.lose{color:#FF8A8A}
  #over .big{font-size:46px;font-weight:900;color:#FFD479;font-variant-numeric:tabular-nums;line-height:1}
  #over .cmp{font-size:12.5px;color:#8E88A8;line-height:1.7}
  #over .cmp b{color:#6FD8C8}
  #tileShow{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:23px;font-weight:900;color:rgba(18,17,30,.6)}
  #over button{max-width:230px;width:100%}
  #levelPick{position:fixed;inset:0;background:rgba(18,17,30,.97);display:none;z-index:95;
    flex-direction:column;padding:26px 20px;overflow-y:auto}
  #levelPick h2{margin:0 0 14px;font-size:18px;text-align:center}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:360px;margin:0 auto;width:100%}
  /* 新发现弹窗 */
  #discover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:92;pointer-events:none;background:rgba(18,17,30,.55)}
  #discover.show{display:flex;animation:dIn .3s ease}
  @keyframes dIn{from{opacity:0}to{opacity:1}}
  .dcard{background:#1E1C2E;border-radius:22px;padding:20px 26px 18px;text-align:center;
    box-shadow:0 0 0 2px #FFD479,0 14px 50px rgba(0,0,0,.6);animation:dPop .45s cubic-bezier(.2,1.5,.4,1)}
  @keyframes dPop{0%{transform:scale(.5) rotate(-6deg)}60%{transform:scale(1.06) rotate(1deg)}100%{transform:scale(1)}}
  .dtag{font-size:12px;font-weight:900;color:#FFD479;letter-spacing:.2em;margin-bottom:8px}
  .dimg{width:104px;height:104px;margin:0 auto 10px;border-radius:18px;display:flex;
    align-items:center;justify-content:center;overflow:hidden}
  .dname{font-size:24px;font-weight:900;color:#EDEAF5}
  .drare{font-size:11.5px;color:#8E88A8;margin-top:3px;letter-spacing:.06em}
  .dhint{font-size:12px;color:#6FD8C8;margin-top:11px;max-width:180px;line-height:1.5}
  /* 图鉴 */
  #codex{position:fixed;inset:0;background:rgba(18,17,30,.98);display:none;z-index:96;
    flex-direction:column;padding:24px 18px;overflow-y:auto}
  #codex.show{display:flex}
  .chead{text-align:center;margin-bottom:16px}
  .chead h2{margin:0;font-size:19px;font-weight:900}
  .chead .sub{font-size:12px;color:#8E88A8;margin-top:4px}
  #codexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:380px;
    margin:0 auto;width:100%}
  .ccell{background:#1B1930;border-radius:14px;padding:10px 6px 8px;text-align:center;
    box-shadow:inset 0 0 0 1px #2A2740}
  .ccell.locked{opacity:.55}
  .cbox{width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;
    justify-content:center;margin-bottom:6px}
  .cname{font-size:12px;font-weight:800;color:#EDEAF5}
  .crare{font-size:9.5px;color:#8E88A8;margin-top:2px}
  /* 每日挑战 / 星尘商店 */
  #dailyPanel,#shopPanel{position:fixed;inset:0;background:rgba(18,17,30,.98);display:none;z-index:97;
    flex-direction:column;padding:24px 18px;overflow-y:auto}
  #dailyPanel.show,#shopPanel.show{display:flex}
  #dailyList,#shopList{display:flex;flex-direction:column;gap:10px;max-width:400px;margin:0 auto;width:100%}
  .drow{background:#1B1930;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;
    box-shadow:inset 0 0 0 1px #2A2740}
  .drow.done{background:#16281F;box-shadow:inset 0 0 0 1px #2E6B4A}
  .drow .mark{font-size:19px;flex:0 0 auto;width:24px;text-align:center}
  .drow .body{flex:1 1 auto;min-width:0}
  .drow .t{font-size:13.5px;font-weight:700;color:#EDEAF5}
  .drow .p{font-size:11.5px;color:#8E88A8;margin-top:3px}
  .drow .bar{height:4px;border-radius:2px;background:#2A2740;margin-top:6px;overflow:hidden}
  .drow .bar i{display:block;height:100%;background:linear-gradient(90deg,#6FD8C8,#FFD479)}
  #dailyReward{text-align:center;font-size:12.5px;color:#FFD479;margin-top:14px;line-height:1.7;min-height:20px}
  .srow{background:#1B1930;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;
    box-shadow:inset 0 0 0 1px #2A2740}
  .srow.selected{box-shadow:inset 0 0 0 2px #FFD479}
  .srow .swatch{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .srow .body{flex:1 1 auto;min-width:0}
  .srow .t{font-size:13.5px;font-weight:700;color:#EDEAF5}
  .srow .p{font-size:11px;color:#8E88A8;margin-top:2px}
  .srow button{flex:0 0 auto;padding:9px 14px;font-size:12.5px;border-radius:10px;width:auto;
    background:#FFD479;color:#141322}
  .srow button.owned{background:#2E6B4A;color:#DFF7E9}
  .srow button.locked{background:#242238;color:#6B6588;box-shadow:inset 0 0 0 1px #37335A}
  /* 玩法说明 */
  #helpPanel{position:fixed;inset:0;background:rgba(18,17,30,.985);display:none;z-index:98;
    flex-direction:column;padding:22px 16px;overflow-y:auto}
  #helpPanel.show{display:flex}
  #helpBody{max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:11px}
  .hcard{background:#1B1930;border-radius:14px;padding:13px 15px;box-shadow:inset 0 0 0 1px #2A2740}
  .hcard .ht{font-size:13.5px;font-weight:800;color:#FFD479;margin-bottom:6px;display:flex;
    align-items:center;gap:7px}

<!-- 元游戏层（存档 / 星尘 / 主题商店 / 每日挑战）。
     ⚠️ 必须是**普通脚本，不能加 type="module"** ——
     file:// 协议下 ESM 会被 CORS 拦掉而**静默不加载**（页面照常显示，
     但商店与每日挑战全部失效，且控制台未必报错）。 -->
<script src="meta.js"></script>

<script>
(function(){
  'use strict';

  /* =====================================================================
     纯逻辑层 —— 零 DOM 依赖，可原样移植为 TypeScript 并单测。

     方块编码：
       -1  空
        0  炸弹（落下清空自身 3×3）
     1..99 普通方块（数字即等级）
       100 石块（不可合成，只能被炸弹或锤子清除）
       101 彩虹（万能块：与任意相邻单块即可合成，产出该块等级 +1）
     ===================================================================== */
  var Logic = (function(){
    var COLS = 6, ROWS = 8;
    var EMPTY = -1, BOMB = 0, STONE = 100, RAINBOW = 101;

    var idx = function(c, r){ return r * COLS + c; };
    var empty = function(){ var g = new Array(COLS*ROWS); for (var i=0;i<g.length;i++) g[i]=EMPTY; return g; };
    var clone = function(g){ return g.slice(); };
    var isNormal = function(v){ return v >= 1 && v <= 99; };
    var isBomb = function(v){ return v === BOMB; };
    var isStone = function(v){ return v === STONE; };
    var isRainbow = function(v){ return v === RAINBOW; };

    function gravity(g){
      for (var c = 0; c < COLS; c++){
        // k 必须显式声明：脚本处于 'use strict'，未声明赋值会抛 ReferenceError
        var stack = [], r, k;
        for (r = ROWS-1; r >= 0; r--){ var v = g[idx(c,r)]; if (v >= 0) stack.push(v); }
        for (r = ROWS-1, k = 0; r >= 0; r--, k++) g[idx(c,r)] = k < stack.length ? stack[k] : EMPTY;
      }
      return g;
    }
    function height(g, c){
      var h = 0;
      for (var r = 0; r < ROWS; r++) if (g[idx(c,r)] >= 0) h++;
      return h;
    }
    function neighborsOf(g, p){
      var pc = p % COLS, pr = (p/COLS)|0, nb = [];
      if (pr > 0) nb.push(idx(pc, pr-1));
      if (pr < ROWS-1) nb.push(idx(pc, pr+1));
      if (pc > 0) nb.push(idx(pc-1, pr));
      if (pc < COLS-1) nb.push(idx(pc+1, pr));
      return nb;
    }

    /* 找出所有"可合成的组合"。
       规则：
         · 同等级四邻连通的普通方块，size>=2 → 可合成（不消耗彩虹）
         · 单块普通方块若紧邻彩虹 → 可与彩虹一起合成（产出该块等级 +1）
       这样设计的原因：彩虹是稀缺资源，不该被已经能自己合成的大块白白吃掉。 */
    function mergeSets(g){
      var seen = new Array(g.length).fill(false), out = [];
      for (var c = 0; c < COLS; c++) for (var r = 0; r < ROWS; r++){
        var s = idx(c,r);
        if (!isNormal(g[s]) || seen[s]) continue;
        var lvl = g[s], stack = [s], comp = [];
        seen[s] = true;
        while (stack.length){
          var p = stack.pop(); comp.push(p);
          var nb = neighborsOf(g, p);
          for (var k = 0; k < nb.length; k++){
            var n = nb[k];
            if (!seen[n] && g[n] === lvl){ seen[n] = true; stack.push(n); }
          }
        }
        var set = comp.slice();
        if (comp.length === 1){
          var rainbows = [];
          for (var q = 0; q < comp.length; q++){
            var nb2 = neighborsOf(g, comp[q]);
            for (var w = 0; w < nb2.length; w++){
              if (isRainbow(g[nb2[w]]) && rainbows.indexOf(nb2[w]) < 0) rainbows.push(nb2[w]);
            }
          }
          if (rainbows.length) set = comp.concat(rainbows);
        }
        if (set.length >= 2) out.push({ cells: set, level: lvl });
      }
      return out;
    }

    /* 取一个组合来合成：格子数最多优先；并列取"最低、最靠左"，保证确定性 */
    function pickSet(g, sets){
      var best = null, bk = null;
      for (var i = 0; i < sets.length; i++){
        var set = sets[i], lowest = -1, lowc = 99;
        for (var k = 0; k < set.cells.length; k++){
          var p = set.cells[k], pc = p % COLS, pr = (p/COLS)|0;
          if (pr > lowest || (pr === lowest && pc < lowc)){ lowest = pr; lowc = pc; }
        }
        var key = [set.cells.length, lowest, -lowc];
        if (!bk || key[0] > bk[0] || (key[0] === bk[0] && key[1] > bk[1]) ||
            (key[0] === bk[0] && key[1] === bk[1] && key[2] > bk[2])){
          bk = key; best = { set: set, at: idx(lowc, lowest), col: lowc, row: lowest };
        }
      }
      return best;
    }

    function mergeStep(g, bonusCol, mult){
      gravity(g);
      var sets = mergeSets(g);
      if (!sets.length) return null;
      var pick = pickSet(g, sets);
      var lvl = pick.set.level, cells = pick.set.cells.slice();
      for (var i = 0; i < cells.length; i++) g[cells[i]] = EMPTY;
      g[pick.at] = lvl + 1;
      gravity(g);
      var isBonus = (bonusCol >= 0 && pick.col === bonusCol);
      var base = scoreFor(lvl + 1) * (isBonus ? 2 : 1);
      return { level: lvl, to: lvl + 1, cells: cells, at: pick.at, col: pick.col, row: pick.row,
               bonus: isBonus, base: base, pts: Math.round(base * mult) };
    }
    function resolve(g, bonusCol, mult){
      if (mult === undefined) mult = 1;
      var ev = [], e, guard = 0;
      while ((e = mergeStep(g, bonusCol, mult)) && guard++ < 800) ev.push(e);
      return ev;
    }

    /* 炸弹：清空以落点为中心的 3×3（含自身与石块），然后压实 */
    function explode(g, at){
      var c0 = at % COLS, r0 = (at/COLS)|0, cleared = [];
      for (var dc = -1; dc <= 1; dc++) for (var dr = -1; dr <= 1; dr++){
        var c = c0 + dc, r = r0 + dr;
        if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
        var i = idx(c, r);
        if (g[i] >= 0){ cleared.push({ i: i, v: g[i], c: c, r: r }); g[i] = EMPTY; }
      }
      gravity(g);
      return cleared;
    }
    /* 锤子：敲掉任意一格（石块也能敲） */
    function smash(g, at){
      if (g[at] < 0) return null;
      var v = g[at], c = at % COLS, r = (at/COLS)|0;
      g[at] = EMPTY;
      gravity(g);
      return { i: at, v: v, c: c, r: r };
    }
    function drop(g, col, value){
      var h = height(g, col);
      if (h >= ROWS) return null;
      var at = idx(col, ROWS-1-h);
      g[at] = value;
      return { at: at, col: col, row: ROWS-1-h, value: value };
    }

    /* 关卡开始时预置石块：每列最多一块。
       关键设计：石块**不放在最底部**，而是垫 1-2 个方块后再放。
       放在底部只是浪费一格；垫高之后石块把这一列**切成两段** ——
       下方那截只能横向跟邻列合成，上方另起一组。
       这是"逼玩家重新规划"的空间约束，也是锤子的主要用途。 */
    /* 关卡开始时预置石块。
       石块**垫高放置**，把一列切成两段（下方那截只能横向跟邻列合成）。

       ⚠️ 这里修过一个让玩家"看不懂"的真问题（用户报「没接触到怎么就消掉了」）：
       原先垫底方块**一律写成 1 级**，于是：
         · 横向：相邻列同为 1 级 → 左右成对
         · 竖向：同一列叠 2 层同为 1 级 → 上下成对
       开局棋盘上就已经存在"自己就会合"的组合。玩家往别处落一子，
       resolve() 会把这些对子也合掉 → "我没碰它，它怎么没了"。
       实测（用与游戏完全一致的调用签名）：**16 关里 9 关开局就有可合成组合**。

       现在：垫底等级取自互不相同的池子，并且**逐格校验**（横向 + 竖向），
       任何同级相邻都会被就地改掉，直到全盘干净。 */
    function placeStones(g, count, seed){
      if (count <= 0) return g;
      var rng = mulberry32(seed), cols = [], c;
      for (c = 0; c < COLS; c++) cols.push(c);
      for (var i = cols.length-1; i > 0; i--){
        var j = Math.floor(rng() * (i+1)), t = cols[i]; cols[i] = cols[j]; cols[j] = t;
      }
      var n = Math.min(count, COLS);
      var POOL = [1, 2, 3, 4, 5, 6, 7];
      for (var i2 = POOL.length - 1; i2 > 0; i2--){
        var j2 = Math.floor(rng() * (i2 + 1)), t2 = POOL[i2]; POOL[i2] = POOL[j2]; POOL[j2] = t2;
      }
      for (var k = 0; k < n; k++){
        var cc = cols[k];
        var base = 1 + Math.floor(rng() * 2);
        if (base + 2 > ROWS) continue;
        for (var b = 0; b < base; b++){
          // 同一列上下两层也必须不同级（否则竖向就成对）
          var lv = POOL[(k + b * 3) % POOL.length];
          g[idx(cc, ROWS-1-b)] = lv;
        }
        g[idx(cc, ROWS-1-base)] = STONE;
      }
      /* 逐格清理：任何同级相邻（横 or 竖）都改掉，直到全盘无对。
         用"改动即重扫"的朴素循环 —— 棋盘只有 48 格，代价可忽略，
         换来的是"开局绝不可能自己合"这个硬保证。 */
      for (var guard = 0; guard < 200; guard++){
        var changed = false;
        for (var c2 = 0; c2 < COLS && !changed; c2++){
          for (var r2 = 0; r2 < ROWS && !changed; r2++){
            var p = idx(c2, r2), v = g[p];
            if (!(v >= 1 && v <= 99)) continue;
            var nb = [];
            if (c2 > 0) nb.push(idx(c2-1, r2));
            if (c2 < COLS-1) nb.push(idx(c2+1, r2));
            if (r2 > 0) nb.push(idx(c2, r2-1));
            if (r2 < ROWS-1) nb.push(idx(c2, r2+1));
            for (var q = 0; q < nb.length; q++){
              if (g[nb[q]] === v){
                // 换成一个与所有邻居都不同的等级
                var cand = 1;
                for (var tryLv = 1; tryLv <= 9; tryLv++){
                  var clash = false;
                  var nb2 = nb.concat([p]);
                  for (var w = 0; w < nb2.length; w++){
                    if (nb2[w] !== p && g[nb2[w]] === tryLv) { clash = true; break; }
                  }
                  if (!clash){ cand = tryLv; break; }
                }
                g[p] = cand;
                changed = true;
                break;
              }
            }
          }
        }
        if (!changed) break;
      }
      return g;
    }

    function isFull(g, c){ return height(g, c) >= ROWS; }
    function anyFull(g){ for (var c = 0; c < COLS; c++) if (isFull(g,c)) return true; return false; }
    function maxLevel(g){ var m = 0; for (var i=0;i<g.length;i++) if (isNormal(g[i]) && g[i] > m) m = g[i]; return m; }
    function maxHeight(g){ var m=0; for (var c=0;c<COLS;c++){ var h=height(g,c); if(h>m)m=h; } return m; }
    function countStone(g){ var n=0; for (var i=0;i<g.length;i++) if (isStone(g[i])) n++; return n; }
    function scoreFor(toLevel){ return 5 * Math.pow(2, toLevel); }
    /* 连击曲线：连续 N 次落子都合到，倍率 = 1 + N*0.5，上限 ×3 */
    function multiplierFor(combo){ return Math.min(1 + combo * 0.5, 3); }

    function mulberry32(a){
      return function(){
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function hashStr(s){
      var h = 2166136261;
      for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    /* 序列：普通块按权重；炸弹与彩虹按固定概率插入。三个比率都是实测校准值。 */
    var BOMB_RATE = 0.06, RAINBOW_RATE = 0.05;
    var W = [0.34, 0.30, 0.24, 0.12];
    function makeSeq(seed){
      var rng = mulberry32(seed);
      return function(){
        var r = rng();
        if (r < BOMB_RATE) return BOMB;
        if (r < BOMB_RATE + RAINBOW_RATE) return RAINBOW;
        var x = rng(), acc = 0;
        for (var i = 0; i < W.length; i++){ acc += W[i]; if (x < acc) return i + 1; }
        return 1;
      };
    }

    /* ---------- 关卡表 ----------
       goal: level(N级) / score(N分) / combo(连击×N) / chain(N次连锁)
       全部由 test-tower4-logic.mjs 用 AI 逐关实跑验证可达。 */
    var LEVELS = [
      { goal:{k:'level',v:3},    moves:0 ,  bonus:-1, stones:0, hammer:0, refresh:0, tip:'点一列放下方块，同级相邻会自动合成' },
      { goal:{k:'level',v:4},    moves:0 , bonus:-1, stones:0, hammer:0, refresh:0, tip:'让同级的挨在一起，别把路堵死' },
      { goal:{k:'score',v:1200}, moves:25,  bonus:-1, stones:0, hammer:0, refresh:0, tip:'分数会乘上连击倍率，连续合成很值钱' },
      { goal:{k:'combo',v:2},    moves:15,  bonus:-1, stones:0, hammer:0, refresh:0, tip:'连击 ×2 = 连续 2 手都合到' },
      { goal:{k:'level',v:5},    moves:15, bonus:-1, stones:0, hammer:0, refresh:0, tip:'有步数限制，每一手都要有意义' },
      { goal:{k:'level',v:5},    moves:10,  bonus:2,  stones:0, hammer:0, refresh:0, tip:'金色列：合成落在这里，分数翻倍' },
      { goal:{k:'score',v:4000}, moves:40,  bonus:4,  stones:0, hammer:0, refresh:0, tip:'为了双倍，值得把方块往金列堆吗？' },
      { goal:{k:'level',v:5},    moves:25,  bonus:-1, stones:3, hammer:0, refresh:0, tip:'🧱 石块不能合成，把一列切成了两段' },
      { goal:{k:'level',v:5},    moves:10,  bonus:-1, stones:3, hammer:2, refresh:0, tip:'🔨 锤子能敲掉任意一格 —— 包括石块' },

      /* 越高越急促：1000ms → 380ms */
      period: Math.round(FEEL.HEART.periodMax + (FEEL.HEART.periodMin - FEEL.HEART.periodMax) * lv),
      /* 越高越响：0.05 → 0.20 */
      vol: Math.round((FEEL.HEART.volMin + (FEEL.HEART.volMax - FEEL.HEART.volMin) * lv) * 1000) / 1000,
      /* 红晕不透明度（真实视觉量，跟着 lv 单调增） */
      vig: Math.round(lv * 0.95 * 100) / 100,
      line: Math.round((1 + lv) * 100) / 100        // 危险线粗细倍率 1..2
    };
  }
  /* 绝境逢生判定 —— 独立纯函数，便于单测（见 window.__feel.isClutch）。

     触发口径（与 t3 闸门对齐，闸门就是按它判的 —— 两边口径不一致等于没验收）：
       **一次合成发生时，合成前的最高列高 ≥ ROWS-2（=6，已在危险区）**
     afterH 保留在签名里但**不参与判定**：它只决定演出档次（见 isDeepClutch）。
     为什么不要求"合成后掉出危险区"：那个条件要求"刚好从 6 掉到 5 且别列都不在 6"，
     自然对局里极难稳定出现 —— 一个几乎不触发的机制等于没有机制。
     而"在危险区里还能合出东西"本身就是逆势翻盘的瞬间，叙事上成立。

     验收反例：开局低处（最高列 ≤ 3）的普通合成**不得**触发。
     闸门会专门做这个反例，防"永远开着"——那会退化成噪音，玩家很快无视它。
     演出强度另有一档 isDeepClutch（差一格就死 → 退回安全区），只影响文案。 */
  function isClutch(beforeH, afterH){
    return beforeH >= Logic.ROWS - 2;
  }
  /* 更极端的一档：差一格就死（ROWS-1）→ 合成后退回安全区（≤ROWS-3）。只影响演出文案强度。 */
  function isDeepClutch(beforeH, afterH){
    return beforeH >= Logic.ROWS - 1 && afterH <= Logic.ROWS - 3;
  }

  /* ---------- 视觉 ---------- */
  function cellRect(c, r){
    var el = boardEl.querySelector('.cell[data-c="'+c+'"][data-r="'+r+'"]');
    return el ? el.getBoundingClientRect() : null;
  }
  function burst(rect, color, n, power, size){
    if (!rect) return;
    var cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
    for (var k=0;k<n;k++){
      var p=document.createElement('div'); p.className='p'; p.style.background=color;
      var sz=(3+Math.random()*6)*(power||1); p.style.width=p.style.height=sz+'px';
      p.style.left=(cx-4)+'px'; p.style.top=(cy-4)+'px';
      document.body.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=(24+Math.random()*54)*(power||1);
      (function(el,dx,dy){ requestAnimationFrame(function(){
        el.style.transition='transform .65s cubic-bezier(.2,.7,.4,1), opacity .65s ease';
        el.style.transform='translate('+dx+'px,'+dy+'px) scale(.35)'; el.style.opacity='0'; });
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },720); })
      (p, Math.cos(ang)*dist, Math.sin(ang)*dist-16);
    }
    feelDbg.burstCalls++; feelDbg.burstParticles += n;
  }
  function flyScore(rect, pts, big, bonus, tier){
    if (!rect) return;
    var d=document.createElement('div'); d.className='fly'; d.textContent='+'+pts;
    var fs = tier ? tier.flySize : (big?40:25);
    d.style.fontSize=fs+'px';
    d.style.color = bonus ? '#FFD479' : (big ? '#FFD479' : '#EDEAF5');
    /* 闸门（t3）要求的可观测信号：这一笔浮字对应多大的合成。
       data-blocks = **这一手总共消掉几块**（整条合成链的合计，不是单个事件）
       data-lv     = 合成后等级（链里最终产出的那个等级，供闸门按等级分组）
       没有它们，外部只能看到"多了一个 .fly"，无法比较大小合成 ——
       而那正是用户抱怨的「大合成与小合成排场相同」。 */
    if (tier){
      d.dataset.blocks = String(tier.blocks);
      d.dataset.lv = String(tier.lv);
      d.dataset.maxlv = String(tier.level);
      d.dataset.intensity = String(tier.intensity);
      d.dataset.shake = String(tier.shake);
      d.dataset.sound = String(tier.sound);
      d.dataset.particles = String(tier.particles);   // 声明值；闸门另有 .p 计数作独立证据
      d.dataset.clutch = tier.clutch ? '1' : '0';
    }
    d.style.left=(rect.left+rect.width/2-26)+'px'; d.style.top=(rect.top+rect.height/2-12)+'px';
    document.body.appendChild(d);
    feelDbg.flyCount++;
    requestAnimationFrame(function(){
      d.style.transition='transform .95s cubic-bezier(.15,.8,.3,1), opacity .95s ease';
      d.style.transform='translateY(-72px) scale(1.14)'; d.style.opacity='0'; });
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },1000);
  }
  function blastFx(c, r){
    var el = boardEl.querySelector('.cell[data-c="'+c+'"][data-r="'+r+'"]');
    var b = $('blast'); if (!el || !b) return;
    var br = boardEl.getBoundingClientRect(), rr = el.getBoundingClientRect();
    var size = rr.width * 3.4;
    b.style.width = b.style.height = size + 'px';
    b.style.left = (rr.left-br.left + rr.width/2 - size/2) + 'px';
    b.style.top = (rr.top-br.top + rr.height/2 - size/2) + 'px';
    b.style.opacity = '1';
    setTimeout(function(){ b.style.opacity = '0'; }, 200);
  }
  function toast(text, color){
    var t=$('toast'); t.textContent=text; t.style.color=color||'#FFD479';
    t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  }
  /* 震动分级：档位 1..4 → body 上的 .s1...s4（各自独立 keyframes，幅度真不一样）。
     传 0 = 不震（原来的"没合成就不震"行为保持）。 */
  var shakeTimer = null;
  function shake(tier){
    var t = Math.max(1, Math.min(tier || 2, 4));
    feelDbg.lastShake = t;
    document.body.classList.remove('shake','s1','s2','s3','s4');
    void document.body.offsetWidth;
    document.body.classList.add('shake', 's' + t);
    if (shakeTimer) clearTimeout(shakeTimer);
    shakeTimer = setTimeout(function(){
      document.body.classList.remove('shake','s1','s2','s3','s4'); shakeTimer = null;
    }, 470);
  }
  /* 绝境逢生专属演出：全屏闪光 + 大字 + 最强震动 + 叠层音 */
  function clutchFx(){
    var f = $('clutchFx'), t = $('clutchTxt');
    if (f){ f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
      setTimeout(function(){ f.classList.remove('show'); }, 900); }
    if (t){ t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 1250); }
    playClutch();
    buzz([30,45,30,45,60]);
  }

  /* ---------- 分数滚动（不是跳变） ----------
     原实现：render() 里 sc.textContent = score，分数**瞬间跳**到新值。
     用户说"反馈不够充足"的一条子项 —— 数字滚动是"我赚到了"的体感来源。
     用 rAF 手动插值（**不能**用 CSS transition：文字内容不会变）。
     采样口径：任意时刻 #score 的文本都可能落在两端点之间，闸门密集采样即可见中间值。 */
  var scoreView = 0, scoreFrom = 0, scoreTo = 0, scoreRollId = 0, scoreRollStart = 0;
  var SCORE_ROLL_MS = 420;
  function rollScore(){
    scoreTo = score;
    if (scoreView === scoreTo) return;
    if (scoreRollId) cancelAnimationFrame(scoreRollId);
    scoreFrom = scoreView;
    scoreRollStart = (function(){
      return window.performance && performance.now ? performance.now() : Date.now();
    })();
    var ease = function(t){ return 1 - Math.pow(1 - t, 3); };   // easeOutCubic
    var step = function(now){
      var ms = (window.performance && performance.now ? performance.now() : Date.now()) - scoreRollStart;
      var p = Math.min(1, ms / SCORE_ROLL_MS);
      scoreView = Math.round(scoreFrom + (scoreTo - scoreFrom) * ease(p));
      paintScore();
      if (p < 1) scoreRollId = requestAnimationFrame(step);
      else { scoreRollId = 0; scoreView = scoreTo; paintScore(); }
    };
    scoreRollId = requestAnimationFrame(step);
  }
  function paintScore(){ scoreEl.textContent = scoreView; }

  /* ---------- 危险心跳（动态压迫感） ----------
     原实现：$('danger').className = near ? 'on' : '' —— 静态，只有一条细线变红。
     现在：红晕呼吸 + 线脉冲，强度和频率都由 heartParams(maxHeight) 决定。
     两路证据都写：data-level（数值）与真实的 animation-duration / opacity（视觉）。 */
  function applyDanger(){
    var h = Logic.maxHeight(grid);
    var p = heartParams(h);
    var d = $('danger'), v = $('vignette');
    if (d){
      d.className = p.on ? 'on beat' : '';
      d.dataset.level = p.level.toFixed(2);
      d.dataset.height = String(h);
      /* 危险线的可见性由 keyframes 的 opacity 负责（0→1→0.42→0.92）。
         这里**不能**再设内联 opacity —— 内联样式优先级高于 keyframes，
         实测后果：整条线被钉死在 0.45 不再呼吸，"静态"的老毛病原样复发。 */
      d.style.opacity = p.on ? '' : '0';
      d.style.animationDuration = p.period + 'ms';
      d.style.transform = 'scaleY(' + p.line + ')';
      /* 除了会动的动画周期，再给一个**静态可读**的视觉量：
         辉光半径随高度增大（4px → 26px）。闸门/量具可以直接读计算样式，
         不需要"恰好在动画的某一帧采样"就能证明强度随高度变化。 */
      d.style.boxShadow = p.on
        ? '0 0 ' + Math.round(4 + p.level * 22) + 'px rgba(255,80,80,.9)'
        : 'none';
    }
    if (v){
      v.className = p.on ? 'beat' : '';
      v.dataset.level = p.level.toFixed(2);
      v.style.animationDuration = p.period + 'ms';
      v.style.opacity = p.on ? '' : '0';   // 同上：动画期间交给 keyframes
      /* 同样给一个静态量：红晕的"最深处"随高度加深 */
      v.style.setProperty('--deep', String(Math.round((0.30 + p.level * 0.32) * 100) / 100));
    }
  }

  /* ---------- 渲染 ---------- */
  function blockClass(v){
    if (v === Logic.BOMB) return ' bomb';
    if (v === Logic.STONE) return ' stone';
    if (v === Logic.RAINBOW) return ' rainbow';
    return '';
  }
  function blockText(v){
    if (v === Logic.BOMB) return '💣';
    if (v === Logic.STONE) return '🧱';
    if (v === Logic.RAINBOW) return '🌈';
    return gemOf(v).e;
  }
  function blockBg(v){
    if (v === Logic.BOMB || v === Logic.STONE || v === Logic.RAINBOW) return '';
    return COLORS[(v-1) % COLORS.length];
  }
  function blockFont(v){
    if (v === Logic.BOMB) return 20;
    if (v === Logic.STONE) return 18;
    if (v === Logic.RAINBOW) return 20;
    return 22;
  }
  /* 把宝石图铺满格子。图未就绪时保留 emoji 兜底，不阻塞玩法。
     dataset.hyd 标记「这一格已经换成真图了」—— 是 needNew 判据的一部分：
     只比等级会让「先 emoji 后到图」的格子永远不再重建（见 render()）。 */
  var LEGACY_RENDER = false;   // 仅供量具做 A/B 对照，见 window.__feel.setLegacyRender
  function fillGem(el, lv){
    el.textContent = '';
    el.dataset.hyd = '';
    el.style.background = blockBg(lv);
    if (GEM_IMG_STATE[lv] === 'ok' && GEM_IMG[lv]){
      var im = GEM_IMG[lv].cloneNode();
      im.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;pointer-events:none';
      el.textContent = '';
      el.appendChild(im);
      el.style.background = '';   // 有图就不需要底色
      el.style.fontSize = '';
      el.dataset.hyd = '1';
    } else {
      el.textContent = gemOf(lv).e;
      el.style.fontSize = fontOf(lv) + 'px';
      ensureGemImg(lv);
    }
  }
  function fontOf(v){ return 22; }

  function buildBoard(){
    boardEl.innerHTML = '<div id="danger"></div><div id="colHint"></div><div id="blast"></div>';
    for (var r=0;r<Logic.ROWS;r++) for (var c=0;c<Logic.COLS;c++){
      var d=document.createElement('div'); d.className='cell'; d.dataset.c=c; d.dataset.r=r;
      if (c === bonusCol) d.className += ' bcol';
      boardEl.appendChild(d);
    }
    var ch = $('colHead'); ch.innerHTML='';
    for (var i=0;i<Logic.COLS;i++){
      var h=document.createElement('div');
      h.className='ch ' + (i===bonusCol?'bonus':'plain');
      if (i===bonusCol) h.textContent='×2';
      ch.appendChild(h);
    }
  }
  function positionDanger(){
    var d=$('danger'); var ref=boardEl.querySelector('.cell[data-r="1"]');
    if (ref && d){ var br=boardEl.getBoundingClientRect(), rr=ref.getBoundingClientRect();
      d.style.top=(rr.top-br.top+rr.height*0.4)+'px'; }
  }
  /* 危险线位置 + 心跳强度一起更新。分开写会导致 resize 后强度丢失。 */
  function updateDanger(){ positionDanger(); applyDanger(); }
  function render(opts){
    opts = opts || {};
    var popSet={}, boomSet={}, smashSet={}, bornSet={};
    (opts.pop||[]).forEach(function(p){ popSet[p]=1; });
    (opts.boom||[]).forEach(function(p){ boomSet[p]=1; });
    (opts.smash||[]).forEach(function(p){ smashSet[p]=1; });
    (opts.born||[]).forEach(function(p){ bornSet[p]=1; });
    var dropAt = opts.dropAt;

    for (var r=0;r<Logic.ROWS;r++) for (var c=0;c<Logic.COLS;c++){
      var cell=boardEl.querySelector('.cell[data-c="'+c+'"][data-r="'+r+'"]');
      if (!cell) continue;
      var v=grid[Logic.idx(c,r)], existing=cell.firstChild;
      if (v < 0){ if (existing) cell.removeChild(existing); continue; }
      /* 重建判据 —— 这里修的是「新等级宝石永久残留 emoji」的既有缺陷。
         原判据只比等级：
             var needNew = !existing || Number(existing.dataset.lv) !== v;
         而图是**异步**加载的：首次出现某等级时图还没到，fillGem 先渲染 emoji；
         等 im.onload 触发 onGemReady → render() 时等级没变 → needNew=false → 不重建，
         于是这一格**永久**停在 emoji，之后再也不会自愈（实测确认）。
         现在再加一条：这一格是普通块、但还没挂上 <img>，就重建。
         dataset.hyd 由 fillGem 显式维护：「已换成真图」= '1'。
         用 dataset.hyd 而不是 querySelector('img')，是为了让**没加载完/加载失败**的
         两种情况都不会造成无限重建（GEM_IMG_STATE 仍为 loading/fail 时 hyd 为空，
         但重建一次后 needNew 依旧为真 → 每帧重建）。
         所以这里同时要求「图确实已就绪」才重建 —— 图没到就继续用 emoji，等它到。 */
      var lvChanged = !existing || Number(existing.dataset.lv) !== v;
      var imgReady = Logic.isNormal(v) && GEM_IMG_STATE[v] === 'ok' && !!GEM_IMG[v];
      var needNew = lvChanged || (!LEGACY_RENDER && imgReady && existing.dataset.hyd !== '1');
      if (needNew){
        if (existing) cell.removeChild(existing);
        var b=document.createElement('div');
        b.className='blk' + blockClass(v);
        b.dataset.lv=v;
        var id=Logic.idx(c,r);
        if (Logic.isNormal(v)) fillGem(b, v);
        else { b.style.background=blockBg(v); b.style.fontSize=blockFont(v)+'px'; b.textContent = blockText(v); }
        if (popSet[id]) b.className += ' pop';
        else if (boomSet[id]) b.className += ' boom';
        else if (smashSet[id]) b.className += ' smash';
        else if (bornSet[id]) b.className += ' born';
        else if (dropAt && dropAt.at === id){
          b.className += ' drop';
          b.style.setProperty('--fd', '-'+((dropAt.rows+0.6)*(cell.getBoundingClientRect().height+4))+'px');
        }
        cell.appendChild(b);
      }
    }
    /* 分数滚动：进度由 rAF 驱动，render 只负责"把目标值交给滚动器"。
       注意这里**不能**再写 sc.textContent = score —— 那正是"跳变"本身。
       bump 缩放动画挂在"目标值变化"上（而不是"文字变化"上）：
       滚动期间文字每帧都变，按文字触发会变成一直在抖。 */
    if (scoreEl.dataset.bumpTarget !== String(score)){
      scoreEl.dataset.bumpTarget = String(score);
      scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
    }
    rollScore();
    var mxl = Logic.maxLevel(grid) || 1;
    $('best').textContent = mxl >= 1 ? gemName(mxl) : '—';
    $('chainN').textContent = chains;

    var L=level(), mv=$('moves');
    if (L.moves > 0){
      var left = L.moves - movesUsed;
      mv.textContent = left; mv.className = 'v' + (left <= 5 ? ' warn' : '');
    } else { mv.textContent='∞'; mv.className='v'; }

    $('nHammer').textContent = hammerLeft;
    $('nRefresh').textContent = refreshLeft;
    $('nStone').textContent = Logic.countStone(grid);
    $('toolHammer').className = 'tool' + (armed ? ' on' : '') + (hammerLeft <= 0 ? ' dead' : '');
    $('toolRefresh').className = 'tool' + (refreshLeft <= 0 ? ' dead' : '');
    /* 只增删 armed，不要整体赋值 className —— 那会把 shake() 刚加上的 shake 类一起清掉，
       消大块时的震动动画会立刻被移除。 */
    document.body.classList.toggle('armed', !!armed);

    updateCombo(); updateGoal();
    /* 危险心跳：原实现是一句 `danger.className = near ? 'on' : ''` —— 静态。
       现在交给 applyDanger()，强度随最高列高连续变化（data-level + 真实样式两路证据）。 */
    applyDanger();
    updateNext();
  }
  function updateCombo(){
    var m = mult();
    $('comboBar').style.width = Math.min(100, (m - 1) / 2 * 100) + '%';
    $('comboWrap').className = m >= 2 ? 'hot' : '';
    var t = $('comboTxt');
    if (combo === 0) t.textContent = '连击 ×1.0 · 连续合成才能涨';
    else {
      var tiers = ['','','🔥 ','🔥🔥 ','🔥🔥🔥 '];
      t.textContent = (tiers[Math.min(combo,4)]||'') + '连击 ×' + m.toFixed(1) + ' · 已连续 ' + combo + ' 手';
    }
  }
  function updateGoal(){
    var g=level().goal, el=$('goalLabel');
    if (g.k==='level') el.innerHTML = '合出一个 <span class="now">'+g.v+'</span> 级 · 现在 '+Logic.maxLevel(grid);
    else if (g.k==='score') el.innerHTML = '拿到 <span class="now">'+g.v+'</span> 分 · 现在 '+score;
    else if (g.k==='combo') el.innerHTML = '连击到 <span class="now">×'+g.v+'</span> · 现在 ×'+mult().toFixed(1);
    else el.innerHTML = '触发 <span class="now">'+g.v+'</span> 次连锁 · 现在 '+chains;
  }
  function goalMet(){
    var g=level().goal;
    if (g.k==='level') return Logic.maxLevel(grid) >= g.v;
    if (g.k==='score') return score >= g.v;
    if (g.k==='combo') return Math.round(mult()*10) >= Math.round(g.v*10);
    return chains >= g.v;
  }
  function updateNext(){
    [[$('n1'), nextQ[0]||1, 0], [$('n2'), nextQ[1]||1, -4]].forEach(function(t){
      var el=t[0], v=t[1], d=t[2];
      el.className = 'nbox' + (d===0?'':' sm') + blockClass(v);
      if (Logic.isNormal(v)){
        el.textContent = gemOf(v).e;
        el.style.background = blockBg(v);
        el.style.fontSize = (blockFont(v)+d)+'px';
        ensureGemImg(v);
      } else {
        el.textContent = blockText(v);
        el.style.background = blockBg(v);
        el.style.fontSize = (blockFont(v)+d)+'px';
      }
    });
  }
  function say(t, dim){ var m=$('msg'); m.textContent=t; m.className=dim?'dim':''; }

  /* ---------- 交互 ---------- */
  function tapColumn(col){
    if (busy || ended) return;
    audio();
    if (armed){ say('先点棋盘上的方块用锤子，或再点一次🔨取消'); return; }
    if (Logic.isFull(grid, col)){ say('这一列满了 · 换一列'); buzz(12); return; }

    busy = true;
    var val = nextQ.shift(); nextQ.push(seq());
    var h0 = Logic.height(grid, col);
    var d = Logic.drop(grid, col, val);
    movesUsed++;
    playDrop(); buzz(8);
    render({ dropAt:{ at:d.at, rows: Logic.ROWS-1-h0 } });
    if (val === Logic.RAINBOW) playRainbow();

    setTimeout(function(){
      if (val === Logic.BOMB){
        var cleared = Logic.explode(grid, d.at), boomCells = [];
        for (var i=0;i<cleared.length;i++){
          boomCells.push(cleared[i].i);
          burst(cellRect(cleared[i].c, cleared[i].r), '#FF6B6B', 7, 1.3);
        }
        blastFx(d.col, d.row);
        playBoom(); shake(); buzz([24,50,24]);
        toast('炸开！', '#FF8A8A');
        render({ boom: boomCells });
        setTimeout(afterDrop, 260);
      } else {
        afterDrop();
      }
    }, 170);

    function afterDrop(){
      /* 本回合的"危险峰值"：落子（并压实）之后的最高列高。
         绝境逢生要判定的是「曾经进入过危险区，然后被这一次合成解除」，
         所以峰值必须在这里取 —— 取合成之后的值就永远 ≥ 不到阈值，机制永不触发。 */
      var hPeak = Logic.maxHeight(grid);
      var events = Logic.resolve(grid, bonusCol, mult());
      if (events.length){
        var popCells=[], bornCells=[], total=0, lastRect=null, anyBonus=false;
        var totalBlocks = 0, maxBlocks = 0, maxBlockLv = 1;
        var particles = 0, maxIntensity = 0, maxTier = null;
        var newlyFound = null;      // ← 必须在这里声明！漏了它会抛 ReferenceError，
                                    //   下面所有特效（浮字/震动/音效）全部执行不到 ——
                                    //   与上一轮 gemName is not defined 是同一类静默失效。
        for (var i=0;i<events.length;i++){
          var e = events[i];
          popCells = popCells.concat(e.cells);
          bornCells.push(e.at);
          total += e.pts;
          if (e.bonus) anyBonus = true;
          totalBlocks += e.cells.length;
          if (e.cells.length > maxBlocks){ maxBlocks = e.cells.length; maxBlockLv = e.to; }
          /* 每一个事件**各自**按自己的等级+块数取强度 ——
             整条链共用一个强度会让"链里有个大块"被平均掉，
             正是"大小合成排场相同"的另一种形式。 */
          var ie = intensityFor(e.to, events.length, e.cells.length, combo + 1);
          var te = tierFor(ie);
          if (ie > maxIntensity){ maxIntensity = ie; maxTier = te; }
          var nP = particlesFor(te, e.cells.length);
          particles += nP;
          burst(cellRect(e.col, e.row), COLORS[(e.to-1)%COLORS.length], nP, te.power);
          if (i === events.length-1) lastRect = cellRect(e.col, e.row);
          // 图鉴：首次合出这个等级就记下来，并弹出「新发现」
          // 写入必须走 meta.markCodexSeen()（它内部会 save 到统一的存档键）。
          // 早期版本在这里直写 codexSeen 再调自建 save()，会把 themes/stats/daily 一起抹掉。
          if (!codexSeen[e.to]){
            codexSeen[e.to] = 1;
            newlyFound = e.to;
            if (meta) { try { meta.markCodexSeen(e.to); } catch(err){} }
          }
          ensureGemImg(e.to);
        }
        score += total;
        if (events.length > 1) chains++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        var topLv = events[events.length-1].to;

        /* ---- 绝境逢生：先判，再决定演出档位 ---- */
        var afterH = Logic.maxHeight(grid);
        var clutch = isClutch(hPeak, afterH);
        var deep = isDeepClutch(hPeak, afterH);
        if (clutch){
          feelDbg.clutchCount++;
          maxIntensity = Math.min(maxIntensity + FEEL.CLUTCH_BONUS, 12);
          maxTier = tierFor(maxIntensity);
        }

        var tier = {
          level: Math.max(topLv, maxBlockLv), blocks: totalBlocks, maxBlocks: maxBlocks,
          lv: topLv, intensity: Math.round(maxIntensity*100)/100,
          shake: clutch ? FEEL.CLUTCH_SHAKE : maxTier.shake,
          sound: maxTier.sound,
          flySize: flySizeFor(maxTier, totalBlocks),   // ← 字号按"这一手消几块"缩放
          particles: particles, clutch: clutch, deep: deep, beforeH: hPeak, afterH: afterH
        };
        feelDbg.lastIntensity = tier.intensity;
        feelDbg.lastTier = tier;
        feelDbg.lastMerge = { blocks: totalBlocks, maxBlocks: maxBlocks, toLevel: topLv,
                              intensity: tier.intensity, particles: particles, shake: tier.shake,
                              sound: tier.sound, flySize: tier.flySize, clutch: clutch,
                              beforeH: hPeak, afterH: afterH };

        flyScore(lastRect, total, topLv>=5, anyBonus, tier);
        playMerge(topLv, events.length>1, anyBonus, combo, tier.sound);
        shake(tier.shake);                        // ← 分级震动（1..4 档，独立 keyframes）
        if (clutch) clutchFx();                   // ← 专属强化演出：全屏闪光 + 大字 + 最强震动

        if (newlyFound && newlyFound >= 3) {
          // 新宝石比连击提示更重要 —— 这正是"想看下一个长什么样"的驱动力
          /* 但"绝境逢生"与"新发现"可能在同一手同时发生（濒死时合出全新等级）。
             两者都是全屏居中的庆祝：clutchTxt 大字在 38%，dcard 卡片占 35%~65%，
             实测 6 种视口**全部重叠 52px**（大字整行落在卡片里，且卡片 z-index 92
             盖住 z-index 86 的大字 → 文字被卡片压掉一半，看起来像渲染错乱）。
             为什么不挪位置：320x568 的"头部底边~卡片顶边"安全带只有 49px < 大字 52px，
             844x390 横屏更是 -43px（卡片顶边比头部底边还高）—— **不存在**一个
             能同时避开两者的位置，挪到哪都会压到东西。
             所以改成**串行**：先让「救回来了！」演完（clutchTxt 动画 1.15s），
             再弹「新发现」。两场庆祝都完整、都看得见，也不会互相抢注意力。 */
          if (clutch) {
            setTimeout(function(){ showDiscovery(newlyFound); }, 1300);
          } else {
            showDiscovery(newlyFound);
          }
        }
        else if (clutch) { toast(deep ? '救回来了！' : '稳住了！', '#FFD479'); }
        else if (combo >= 4) { toast('连击 ×' + mult().toFixed(1) + '！', '#FFD479'); }
        else if (topLv >= 6) { toast('漂亮', '#6FD8C8'); }
        else if (anyBonus) { toast('双倍 ×2', '#FFD479'); }
        say('合成出 ' + gemName(topLv) + '  +' + total + (anyBonus?'（双倍）':'')
            + (combo>=2?'（连击 ×'+mult().toFixed(1)+'）':'')
            + (clutch?'（绝境逢生）':''));
        render({ pop: popCells, born: bornCells });
        setTimeout(function(){ render(); finishTurn(); }, 270);
      } else {
        combo = 0;
        say(val === Logic.BOMB ? '炸弹没有引发合成 · 连击中断'
            : val === Logic.RAINBOW ? '彩虹落下了 · 和旁边的方块相邻就会合成'
            : ('放下 ' + gemName(val) + ' · 没有合成，连击中断'), true);
        render();
        finishTurn();
      }
    }
  }

  /* 「新发现」弹窗 —— 玩家玩下去的核心动力之一：想知道下一个长什么样 */

  /* ---------- 每日挑战 ---------- */
  /* ⚠️ 字段名必须与 meta.js 的 makeDaily() 对齐，不能靠猜：
     getDaily() 返回 { date, tasks[], doneCount, total, allDone, claimed, streak, allClearReward }
     每个 task 是 { id, kind, text, target, reward, progress, done }
     （我第一版按 items/label 读，结果面板永远空白 —— 这是"接口靠猜"的典型翻车。） */
  function openDaily(){
    if (!meta){ say('存档未就绪，无法读取每日挑战', true); return; }
    var d = meta.getDaily();
    var list = $('dailyList'); list.innerHTML = '';
    var tasks = (d && d.tasks) ? d.tasks : [];
    for (var i = 0; i < tasks.length; i++){
      (function(it){
        var row = document.createElement('div');
        row.className = 'drow' + (it.done ? ' done' : '');
        var mk = document.createElement('div'); mk.className = 'mark'; mk.textContent = it.done ? '✅' : '◻️';
        var body = document.createElement('div'); body.className = 'body';
        var t = document.createElement('div'); t.className = 't'; t.textContent = it.text || it.kind;
        var p = document.createElement('div'); p.className = 'p';
        var cur = (it.progress === undefined ? 0 : it.progress);
        p.textContent = cur + ' / ' + it.target + '　奖励 ' + it.reward + ' 星尘';
        var bar = document.createElement('div'); bar.className = 'bar';
        var fill = document.createElement('i');
        var pct = it.target > 0 ? Math.min(100, cur / it.target * 100) : 0;
        fill.style.width = pct + '%';
        bar.appendChild(fill);
        body.appendChild(t); body.appendChild(p); body.appendChild(bar);
        row.appendChild(mk); row.appendChild(body);
        list.appendChild(row);
      })(tasks[i]);
    }
    var doneN = d ? d.doneCount : 0;
    var totalN = d ? d.total : 0;
    $('dailySub').textContent = (d ? d.date : '') + ' · 已完成 ' + doneN + ' / ' + totalN;
    $('dailyReward').innerHTML = (d && d.claimed)
      ? '今天的奖励已领取 · 明天再来'
      : (d && d.allDone
          ? '全部完成！结算时自动发放 <b>' + d.allClearReward + '</b> 星尘'
          : '完成全部 ' + totalN + ' 项可得 <b>' + (d ? d.allClearReward : 0) + '</b> 星尘');
    $('dailyPanel').classList.add('show');
  }

  function openShop(){
    if (!meta){ say('存档未就绪，无法打开商店', true); return; }
    var themes = meta.listThemes();
    var myDust = meta.getDust();
    $('shopDust').textContent = myDust;
    var list = $('shopList'); list.innerHTML = '';
    for (var i = 0; i < themes.length; i++){
      (function(th){
        var row = document.createElement('div');
        row.className = 'srow' + (th.selected ? ' selected' : '');
        var sw = document.createElement('div'); sw.className = 'swatch';
        // 用主题自己的棋盘/强调色做色板预览
        sw.style.background = 'linear-gradient(135deg,' +
          (th.colors && th.colors.board ? th.colors.board : '#222') + ',' +
          (th.colors && th.colors.accent ? th.colors.accent : '#888') + ')';
        var body = document.createElement('div'); body.className = 'body';
        var t = document.createElement('div'); t.className = 't'; t.textContent = th.name;
        var p = document.createElement('div'); p.className = 'p';
        p.textContent = th.owned
          ? (th.selected ? '使用中' : '已拥有')
          : (th.price + ' 星尘' + (myDust >= th.price ? '' : '（还差 ' + (th.price - myDust) + '）'));
        body.appendChild(t); body.appendChild(p);
        var btn = document.createElement('button');
        if (th.owned && th.selected){ btn.textContent = '使用中'; btn.className = 'owned'; btn.disabled = true; }
        else if (th.owned){ btn.textContent = '使用'; btn.onclick = function(){ doSelectTheme(th.id); }; }
        else {
          btn.textContent = '购买';
          if (myDust < th.price){ btn.className = 'locked'; btn.disabled = true; }
          else btn.onclick = function(){ doBuyTheme(th.id); };
        }
        row.appendChild(sw); row.appendChild(body); row.appendChild(btn);
        list.appendChild(row);
      })(themes[i]);
    }
    $('shopPanel').classList.add('show');
  }

  function doBuyTheme(id){
    if (!meta) return;
    var r = null;
    try { r = meta.buyTheme(id); } catch(e){ r = { ok:false, reason:String(e && e.message || e) }; }
    if (r && r.ok === false){
      toast(r.reason === 'insufficient_dust' ? '星尘不够' : ('购买失败：' + (r.reason || '未知')), '#FF8A8A');
      return;
    }
    /* buyTheme **不会自动启用**（返回的 theme.selected = false），
       必须显式 selectTheme —— 否则玩家花了星尘却看不到任何变化。
       这是实测发现的接口语义，不是猜的。 */
    var th = null;
    try { th = meta.selectTheme(id); } catch(e){}
    if (!th && r && r.theme) th = r.theme;
    if (th) applyTheme(th);
    toast('已购买并启用', '#FFD479');
    playWin(); buzz([16,30,16]);
    openShop();                 // 刷新面板
  }

    var t = null;

  /* 把主题配色真正应用到页面（否则"购买"只是数字变化，玩家看不到） */
  function applyTheme(th){
    if (!th || !th.colors) return;
    var c = th.colors;
    try {
      var root = document.documentElement;
      if (c.bg)     root.style.setProperty('--mt-bg', c.bg);
      if (c.board)  root.style.setProperty('--mt-board', c.board);
      if (c.cell)   root.style.setProperty('--mt-cell', c.cell);
      if (c.panel)  root.style.setProperty('--mt-panel', c.panel);
      if (c.accent) root.style.setProperty('--mt-accent', c.accent);
      if (c.bg)     document.body.style.background = c.bg;
      if (c.board){ var b = $('board'); if (b) b.style.background = c.board; }
      // 方块配色：优先用主题给的 gems，否则退回原色板
      if (c.gems && c.gems.length){
        for (var i = 0; i < COLORS.length && i < c.gems.length; i++) COLORS[i] = c.gems[i];
      }
      render();
    } catch(e){}
  }

        box.textContent = '?';
        box.style.color = '#4A4566';
        box.style.fontSize = '30px';
      }
      var nm = document.createElement('div');
      nm.className = 'cname';
      nm.textContent = seen ? g.n : '未发现';
      var rr = document.createElement('div');
      rr.className = 'crare';
      rr.textContent = seen ? g.r : (lv + ' 级');
      cell.appendChild(box); cell.appendChild(nm); cell.appendChild(rr);
      wrap.appendChild(cell);
    }
    var found = 0;
    for (var k in codexSeen) if (codexSeen[k]) found++;
    $('codexCount').textContent = found + ' / ' + GEMS.length;
    $('codex').classList.add('show');
  }

  /* 锤子：敲掉点击的那一格 */
  function useHammerAt(c, r){
    if (hammerLeft <= 0 || busy || ended) return;
    var at = Logic.idx(c, r);
    if (grid[at] < 0) return;
    var wasStone = Logic.isStone(grid[at]);
    var res = Logic.smash(grid, at);
    if (!res) return;
    hammerLeft--;
    armed = false;
    movesUsed++;          // 用道具也算一步 —— 否则道具就没有代价
    combo = 0;            // 打断连击
    playSmash(); buzz([14,26,14]);
    burst(cellRect(c, r), wasStone ? '#D8D2E8' : '#FFD479', 10, 1.2);
    toast(wasStone ? '石块敲碎了' : '敲掉了', '#FFD479');
    say('用掉一个锤子' + (wasStone ? '（敲掉了石块）' : '') + ' · 连击中断');
    render({ smash: [at] });
    setTimeout(function(){ render(); finishTurn(); }, 250);
  }

  /* 换一个：丢掉当前方块 */
  function useRefresh(){
    if (refreshLeft <= 0 || busy || ended) return;
    var dropped = nextQ.shift(); nextQ.push(seq());
    refreshLeft--;
    combo = 0;
    playSmash(); buzz(10);
    toast('换掉了', '#6FD8C8');
    say('丢掉一个' + blockText(dropped) + ' · 连击中断');
    render();
  }

  function finishTurn(){
    busy = false;
    render();
    if (Logic.anyFull(grid)) return lose('有一列堆满了');
    var L = level();
    if (L.moves > 0 && movesUsed >= L.moves) return lose('步数用完了');
    if (goalMet()) return win();
    /* 危险度不足时给一句提示（原来只有这一句 —— 静悄悄的一条文字，
       真正的压迫感来自 applyDanger() 的呼吸红晕与心跳音）。 */
    if (Logic.maxHeight(grid) >= Logic.ROWS-2) say('小心 · 快堆到顶了');
    heartLoop();          // 危险刚出现/刚解除都在这里重新定周期
  }

  /* 一局结束的统一入口：把结算全部委托给 meta.applyRun()。
     它内部一次做完：星尘结算 + 统计 + 每日进度 + 发奖 + 落盘。
     早期版本在这里手写 streak/dust/unlocked 再 save()，会与 meta 的存档互相覆盖。 */
  function settleRun(won){
    if (!meta) return null;
    try {
      return meta.applyRun({
        score: score,
        maxLevel: Logic.maxLevel(grid),
        chains: chains,
        combo: maxCombo,
        won: won
      });
    } catch (e) {
      if (window.console && console.error) console.error('applyRun 失败：', e);
      return null;
    }
  }

  function win(){
    ended = true;
    var res = settleRun(true);
    syncFromMeta();                      // 结算后同步派生视图（含 unlocked）
    // 通关也要解锁下一关（meta 不管关卡解锁，那是本文件的职责）
    if (levelIdx + 1 > unlocked) {
      unlocked = Math.min(levelIdx + 1, Logic.LEVELS.length - 1);
      if (meta) { try { meta.setUnlocked(unlocked); } catch(e){} }
      syncFromMeta();
    }
    var gained = res ? res.dustGained : 0;
    var bonus = '';
    if (res && res.dustFromStreak) bonus += '<br>连续打卡奖励 +' + res.dustFromStreak;
    if (res && res.dustFromDaily)  bonus += '<br>每日挑战奖励 +' + res.dustFromDaily;
    if (res && res.dailyCleared)   bonus += '<br>🎯 <b>今日挑战全部完成！</b>';

    $('overTitle').textContent = '过关！'; $('overTitle').className = 'win';
    $('tileShow').textContent = Logic.maxLevel(grid);
    $('tileShow').style.background = COLORS[(Logic.maxLevel(grid)-1) % COLORS.length];
    $('finalScore').textContent = score;
    $('cmp').innerHTML = '用了 <b>'+movesUsed+'</b> 步 · 最高连击 <b>×'+Logic.multiplierFor(maxCombo).toFixed(1)+'</b>' +
      '<br>最高方块 <b>'+Logic.maxLevel(grid)+'</b> 级 · 星尘 <b>+'+gained+'</b>（共 '+dust+'）' + bonus;
    $('btnNext').textContent = (levelIdx >= Logic.LEVELS.length-1) ? '全部通关 · 重玩' : '下一关';
    $('over').classList.add('show');
    playWin(); buzz([18,40,18,40,30]);
  }

  function lose(why){
    ended = true;
    settleRun(false);
    syncFromMeta();
    $('overTitle').textContent = '没成功 · ' + why; $('overTitle').className = 'lose';
    $('tileShow').textContent = Logic.maxLevel(grid);
    $('tileShow').style.background = COLORS[(Logic.maxLevel(grid)-1) % COLORS.length];
    $('finalScore').textContent = score;
    var g = level().goal;
    var want = g.k==='level' ? ('合出 '+g.v+' 级（差 '+(g.v-Logic.maxLevel(grid))+' 级）')
             : g.k==='score' ? ('达到 '+g.v+' 分（差 '+Math.max(0,g.v-score)+' 分）')
             : g.k==='combo' ? ('连击 ×'+g.v+'（现在 ×'+mult().toFixed(1)+'）')
             : ('触发 '+g.v+' 次连锁（差 '+Math.max(0,g.v-chains)+' 次）');
    $('cmp').innerHTML = '目标：' + want + '<br>历史最高分 <b>' + bestScore + '</b>';
    $('btnNext').textContent = '重开本关';
    $('over').classList.add('show');
    playLose(); buzz([30,60,30]);
  }

  function startLevel(i){
    levelIdx = Math.max(0, Math.min(i, Logic.LEVELS.length-1));
    var L = level();
    bonusCol = L.bonus; hammerLeft = L.hammer || 0; refreshLeft = L.refresh || 0;
    armed = false;
    seq = Logic.makeSeq(Logic.hashStr('lv' + levelIdx));
    grid = Logic.empty();
    Logic.placeStones(grid, L.stones || 0, Logic.hashStr('stone-lv' + levelIdx));
    score = 0; movesUsed = 0; chains = 0; combo = 0; maxCombo = 0;
    /* 分数滚动器也要归零 —— 否则重开时数字会从上一局的分数"滚回去"。
       同时取消在飞的 rAF，避免两局的两个滚动器互相抢写 #score。 */
    if (scoreRollId){ cancelAnimationFrame(scoreRollId); scoreRollId = 0; }
    scoreView = 0; scoreFrom = 0; scoreTo = 0;
    scoreEl.dataset.bumpTarget = ''; paintScore();
    ($('clutchFx')||{}).className = '';
    ($('clutchTxt')||{}).className = '';
    nextQ = [seq(), seq()];
    busy = false; ended = false;
    $('lvLabel').textContent = '第 ' + (levelIdx+1) + ' 关 / ' + Logic.LEVELS.length;
    $('over').classList.remove('show');
    $('levelPick').style.display = 'none';
    say(L.tip, true);
    buildBoard(); updateDanger(); render(); heartLoop();
  }

  function openPick(){
    var g = $('grid'); g.innerHTML='';
    for (var i=0;i<Logic.LEVELS.length;i++){
      (function(i){
        var b=document.createElement('button');
        var locked = i > unlocked;
        b.textContent = locked ? '🔒' : String(i+1);
        b.style.cssText = 'padding:16px 0;font-size:16px;border-radius:12px;' +
          (locked ? 'background:#1E1C2E;color:#4A4566;box-shadow:inset 0 0 0 1px #2A2740;'
                  : (i===levelIdx ? 'background:#FFD479;color:#141322;' : 'background:#242238;color:#EDEAF5;box-shadow:inset 0 0 0 1px #37335A;'));
        b.disabled = locked;
        b.onclick = function(){ startLevel(i); };
        g.appendChild(b);
      })(i);
    }
    $('levelPick').style.display = 'flex';
  }

  /* ---------- 输入 ---------- */
  function cellFromPoint(x, y){
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    var cell = el.closest ? el.closest('.cell') : null;
    if (cell && cell.dataset.c !== undefined) return { c: Number(cell.dataset.c), r: Number(cell.dataset.r) };
    var blk = el.closest ? el.closest('.blk') : null;
    if (blk && blk.parentNode && blk.parentNode.dataset && blk.parentNode.dataset.c !== undefined)
      return { c: Number(blk.parentNode.dataset.c), r: Number(blk.parentNode.dataset.r) };
    return null;
  }
  function colFromPoint(x, y){
    var cell = cellFromPoint(x, y);
    if (cell) return cell.c;
    var el = document.elementFromPoint(x, y);
    var head = el && el.closest ? el.closest('.ch') : null;
    if (head){ var i = Array.prototype.indexOf.call($('colHead').children, head); if (i >= 0) return i; }
    return -1;
  }
  /* 落子预览：幽灵方块提示会落到第几格。
     用现成的 #colHint，但几何从「整列高亮」改成「对齐该列的落点格」——
     原版只高亮整列，玩家仍然不知道会落在第几行（正是用户说的"看不见落点"）。
     松手/移出 → opacity 归 0。 */
  function landingRow(col){
    if (armed || col < 0) return -1;
    var h = Logic.height(grid, col);
    if (h >= Logic.ROWS) return -1;       // 这列满了，没有落点
    return Logic.ROWS - 1 - h;
  }
  function showHint(col){
    var h=$('colHint'); if (!h) return;
    var row = landingRow(col);
    if (row < 0){ h.style.opacity = 0; h.dataset.row = '-1'; h.textContent=''; return; }
    var ref = boardEl.querySelector('.cell[data-c="'+col+'"][data-r="'+row+'"]');
    if (!ref) { h.style.opacity = 0; return; }
    var br=boardEl.getBoundingClientRect(), rr=ref.getBoundingClientRect();
    h.style.left=(rr.left-br.left)+'px';
    h.style.top=(rr.top-br.top)+'px';
    h.style.width=rr.width+'px';
    h.style.height=rr.height+'px';
    h.style.opacity=1;
    h.dataset.col = String(col);
    h.dataset.row = String(row);          // 闸门据此核对"预览几何 = 该列落点格"
    h.textContent = String(row + 1);      // 第几格（1-based，给玩家看）
  }
  var downX=0, downY=0, moved=false;
  function onDown(e){
    downX=e.clientX; downY=e.clientY; moved=false;
    showHint(colFromPoint(e.clientX, e.clientY));
  }
  function onMove(e){
    if (Math.abs(e.clientX-downX)>12 || Math.abs(e.clientY-downY)>12) moved=true;
    showHint(colFromPoint(e.clientX, e.clientY));
  }
  function onUp(e){
    showHint(-1);
    if (moved) return;
    var cell = cellFromPoint(e.clientX, e.clientY);
    if (armed){
      if (cell) useHammerAt(cell.c, cell.r);
      return;
    }
    var c = colFromPoint(e.clientX, e.clientY);
    if (c >= 0) tapColumn(c);
  }
  boardEl.addEventListener('pointerdown', onDown);
  boardEl.addEventListener('pointermove', onMove);
  boardEl.addEventListener('pointerup', onUp);
  boardEl.addEventListener('pointercancel', function(){ showHint(-1); });
  boardEl.addEventListener('pointerleave', function(){ showHint(-1); });
  $('colHead').addEventListener('pointerdown', onDown);
  $('colHead').addEventListener('pointermove', onMove);
  $('colHead').addEventListener('pointerup', onUp);

  $('toolHammer').addEventListener('click', function(){
    if (hammerLeft <= 0){ toast('锤子用完了', '#FF8A8A'); return; }
    if (busy || ended) return;
    armed = !armed;
    say(armed ? '锤子已举起 · 点棋盘上任意一格敲掉它' : '取消锤子', true);
    render();
  });
  $('toolRefresh').addEventListener('click', useRefresh);
  $('btnHelp').addEventListener('click', openHelp);
  $('btnCloseHelp').addEventListener('click', function(){ $('helpPanel').classList.remove('show'); });
  $('btnDaily').addEventListener('click', openDaily);
  $('btnShop').addEventListener('click', openShop);
  $('btnCloseDaily').addEventListener('click', function(){ $('dailyPanel').classList.remove('show'); });
  $('btnCloseShop').addEventListener('click', function(){ $('shopPanel').classList.remove('show'); });
  $('btnCodex').addEventListener('click', openCodex);
  $('btnCloseCodex').addEventListener('click', function(){ $('codex').classList.remove('show'); });
  $('btnRetry').addEventListener('click', function(){ startLevel(levelIdx); });
  $('btnLevels').addEventListener('click', openPick);
  $('btnClosePick').addEventListener('click', function(){ $('levelPick').style.display='none'; });
  $('btnNext').addEventListener('click', function(){
    if (ended && goalMet()) startLevel(Math.min(levelIdx+1, Logic.LEVELS.length-1));
    else startLevel(levelIdx);
  });
  window.addEventListener('resize', updateDanger);
  /* 图到齐后重绘一次，把 emoji 兜底换成真正的宝石图 */
  onGemReady = function(){ if (!busy) render(); };

  load();
  /* 启动时应用已选主题 —— 否则玩家上次买的主题重开就"看不见了" */
  if (meta){
    META_OK = true;
    try { applyTheme(meta.getTheme()); } catch(e){}
  }
  window.__logic = Logic;
  window.__startLevel = startLevel;
  /* 暴露元游戏层，供验收闸门与人工核对读取真实状态 */
  window.__meta = meta;
  window.__openHelp = openHelp;
  window.__openDaily = openDaily;
  window.__openShop = openShop;
  window.__doBuyTheme = doBuyTheme;      // 供端到端验收走真实购买路径
  window.__doSelectTheme = doSelectTheme;
  /* ---------------------------------------------------------------------
     对外测试面（给 smoke-test / run-diag / 闸门用）。
     上一轮的教训：光有"我加了 X"的说法不算证据 —— 必须能从外部读到数字。
     这里把分级/心跳/绝境逢生的**纯函数**也导出去，便于 Node 里直接单测。
     --------------------------------------------------------------------- */
  window.__test = { round: 3 };          // 闸门据此启用本轮 [8]..[13] 新断言
  window.__gate = {                      // 与 t3 闸门约定的名字，两者都设，避免口径漂移
    round: 3,
    snapshot: function(){
      return { grid: grid.slice(), score: score, next: nextQ.slice() };
    },
    lastMerge: function(){ return feelDbg.lastMerge; },
    /* 受控局面：闸门直接摆 3 连块 vs 7 连块做确定性对比。
       返回 true 表示已装入并同步渲染。 */
    setSnapshot: function(s){
      if (!s || !s.grid || s.grid.length !== grid.length) return false;
      for (var i = 0; i < s.grid.length; i++) grid[i] = s.grid[i];
      if (typeof s.score === 'number'){ score = s.score; scoreView = s.score; scoreTo = s.score; paintScore(); }
      if (s.next && s.next.length){ nextQ = s.next.slice(); }
      render(); updateDanger();
      return true;
    },
    /* 直接驱动一次落子，省得闸门自己模拟触摸（触摸路径另有 [4] 覆盖） */
    tap: function(col){ tapColumn(col); return true; },
    isBusy: function(){ return !!busy; },
    isEnded: function(){ return !!ended; }
  };
  window.__feel = {
    dbg: function(){ return JSON.parse(JSON.stringify(feelDbg)); },
    intensityFor: intensityFor,
    tierFor: tierFor,
    heartParams: heartParams,
    isClutch: isClutch,
    isDeepClutch: isDeepClutch,
    landingRow: landingRow,
    maxHeight: function(){ return Logic.maxHeight(grid); },
    /* A/B 对照开关：把 render() 的重建判据退回**修复前**的语义
       （只比等级，不看是否已挂上图）。仅供量具证明"缺陷真实存在、且被正确修复"——
       同一个文件里既能复现旧行为、又能验证新行为，比对比两个不同文件更有说服力
       （两个文件之间总还有别的差异）。返回 true 并立刻重绘。 */
    setLegacyRender: function(on){ LEGACY_RENDER = !!on; render(); return LEGACY_RENDER; },
    isLegacyRender: function(){ return LEGACY_RENDER; },
    reset: function(){ feelDbg.burstCalls = 0; feelDbg.burstParticles = 0;
      feelDbg.flyCount = 0; feelDbg.clutchCount = 0; feelDbg.lastMerge = null; return true; },
    /* 危险/预览的当前可观测状态（闸门与人工排查共用） */
    dangerState: function(){
      var d = $('danger'), v = $('vignette');
      if (!d) return null;
      var cs = getComputedStyle(d), vs = v ? getComputedStyle(v) : null;
      return { level: d.dataset.level, height: Number(d.dataset.height || -1),
               className: d.className, opacity: cs.opacity,
               animationDuration: cs.animationDuration, animationName: cs.animationName,
               boxShadow: cs.boxShadow, transform: cs.transform,
               vignetteClass: v ? v.className : null,
               vignetteOpacity: vs ? vs.opacity : null,
               vignetteDuration: vs ? vs.animationDuration : null,
               vignetteDeep: v ? getComputedStyle(v).getPropertyValue('--deep') : null,
               maxHeight: Logic.maxHeight(grid) };
    },
    hintState: function(){
      var h = $('colHint'); if (!h) return null;
      var cs = getComputedStyle(h), br = boardEl.getBoundingClientRect();
      var r = h.getBoundingClientRect();
      return { opacity: cs.opacity, col: h.dataset.col, row: h.dataset.row,
               text: h.textContent,
               rect: { l: Math.round(r.left-br.left), t: Math.round(r.top-br.top),
                       w: Math.round(r.width), h: Math.round(r.height) },
               visible: r.width > 0 && r.height > 0 && Number(cs.opacity) > 0.1 };
    },
    clutchState: function(){
      var f = $('clutchFx'); if (!f) return null;
      var r = f.getBoundingClientRect(), cs = getComputedStyle(f);
      return { className: f.className, animating: f.classList.contains('show'),
               w: Math.round(r.width), h: Math.round(r.height), opacity: cs.opacity,
               count: feelDbg.clutchCount };
    },
    scoreState: function(){ return { target: score, view: scoreView, text: scoreEl.textContent }; },
    emojiResidue: function(){
      /* 棋盘上"图已就绪却仍显示 emoji"的格子数。
         图没就绪时用 emoji 是**设计**的兜底，不算残留 —— 所以只统计 ok 的等级。 */
      var bad = [], blocks = boardEl.querySelectorAll('.blk');
      for (var i = 0; i < blocks.length; i++){
        var b = blocks[i], lv = Number(b.dataset.lv);
        if (!Logic.isNormal(lv)) continue;
        if (GEM_IMG_STATE[lv] !== 'ok') continue;
        if (!b.querySelector('img')) bad.push({ lv: lv, text: b.textContent });
      }
      return { residue: bad.length, detail: bad.slice(0, 5) };
    },
    imgStates: function(){ return JSON.parse(JSON.stringify(GEM_IMG_STATE)); }
  };
  startLevel(Math.min(unlocked, Logic.LEVELS.length-1));
})();
</script>
</body>
</html>
